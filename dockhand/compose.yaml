services:
  dockhand:
    container_name: Dockhand
    image: fnsys/dockhand:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 1g
    cpu_shares: 512
    ports:
      - 10.0.1.15:3866:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STACK_ROOT}/dockhand/data:/app/data:rw
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - SKIP_DF_COLLECTION=true
      - TZ=America/New_York
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':0BB8' /proc/net/tcp /proc/net/tcp6 2>/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - ce-internal

networks:
  ce-internal:
    external: true
