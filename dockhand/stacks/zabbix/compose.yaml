name: zabbix

services:
  zabbix-server:
    container_name: Zabbix-Server
    image: zabbix/zabbix-server-mysql:alpine-7.4.10
    mem_limit: 768m
    cpu_shares: 1024
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - zabbix-net
    ports:
      - "10.0.1.15:${ZABBIX_SERVER_PORT:-10051}:10051"
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - TZ=${TZ:-America/New_York}
      # Bridge mode: DB is on NAS host — must use LAN IP, not 127.0.0.1
      - DB_SERVER_HOST=10.0.1.15
      - DB_SERVER_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-zabbix}
      - MYSQL_USER=${MYSQL_USER:-zabbix}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - ${STACK_ROOT}/zabbix/data:/var/lib/zabbix
    healthcheck:
      # zabbix_server -R diaginfo fails in container context (rtc Unix socket
      # path mismatch). Port check is reliable: 10051 opens only after DB
      # schema is accepted and the server is fully ready.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10051 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=false

  zabbix-web:
    container_name: Zabbix-Web
    image: zabbix/zabbix-web-nginx-mysql:alpine-7.4.10
    mem_limit: 512m
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - zabbix-net
    depends_on:
      zabbix-server:
        condition: service_healthy
    ports:
      - "10.0.1.15:${ZABBIX_WEB_PORT}:8080"
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - TZ=${TZ:-America/New_York}
      # Bridge mode: DB on NAS host
      - DB_SERVER_HOST=10.0.1.15
      - DB_SERVER_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-zabbix}
      - MYSQL_USER=${MYSQL_USER:-zabbix}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      # Bridge mode: reach server by container name
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=${ZABBIX_SERVER_PORT:-10051}
      - PHP_TZ=${TZ:-America/New_York}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=false
      - haproxy.enable=true
      - haproxy.host=zabbix.olutechsys.com,zabbix.olutech.systems
      - haproxy.port=${ZABBIX_WEB_PORT:-8532}
      - haproxy.backend=zabbix-be
      - haproxy.check.path=/ping

  zabbix-agent:
    container_name: Zabbix-Agent
    image: zabbix/zabbix-agent2:alpine-7.4.10
    mem_limit: 128m
    cpu_shares: 256
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - zabbix-net
    depends_on:
      zabbix-server:
        condition: service_healthy
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - TZ=${TZ:-America/New_York}
      - ZBX_HOSTNAME=${ZBX_HOSTNAME:-zabbixagt2}
      # Bridge mode: reach server by container name
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=${ZABBIX_SERVER_PORT:-10051}
      - ZBX_ACTIVE_ALLOW=true
      - ZBX_PASSIVE_ALLOW=true
      - ZBX_DONTCREATEPIDFILE=1
    volumes:
      - /var/run:/var/run:ro
    healthcheck:
      test: ["CMD", "zabbix_agent2", "-t", "agent.ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=false

networks:
  zabbix-net:
    name: zabbix-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
