# code-server config - linuxserver/code-server image (internal port 8443)
# TLS is terminated at the DSM reverse proxy; code-server uses its own
# auto-generated self-signed cert internally (cert: false = no custom cert).
# DSM reverse proxy must have WebSocket headers: Upgrade + Connection (see compose.yaml).
bind-addr: 0.0.0.0:8443
auth: password
cert: false
disable-telemetry: true
disable-update-check: true
disable-file-downloads: false
disable-workspace-trust: false
links:
  - name: Docker
    url: https://docker.com
  - name: VS Code Docs
    url: https://code.visualstudio.com/docs
  - name: MySQL (NAS)
    url: http://10.0.1.15:3307
  - name: phpMyAdmin
    url: http://10.0.1.15:8378
