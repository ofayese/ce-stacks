# Stack: otspsu - PowerShell Universal (NAS automation / NOC dashboard)
# Exposed on 10.0.1.15:5570; DSM reverse proxy handles TLS termination.
services:
  universal:
    container_name: otspsu
    image: devolutions/powershell-universal:2026.1.4-ubuntu-24.04
    # Devolutions now maintains PSU (acquired Ironman Software). Re-resolve digest on NAS after pull:
    #   docker pull devolutions/powershell-universal:2026.1.4-ubuntu-24.04
    #   docker inspect --format='{{index .RepoDigests 0}}' devolutions/powershell-universal:2026.1.4-ubuntu-24.04
    # Then pin image to devolutions/powershell-universal@sha256:<digest> for production.
    restart: unless-stopped
    # Host-profile fix: 2g -> 1g. PSU + LiteDB working set on this NAS is ~400 MB.
    mem_limit: 1g
    cpu_shares: 512
    # cpus: removed - Synology DS723+ kernel lacks CFS scheduler cgroup (NanoCPUs unsupported)
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - TZ=${TZ:-America/New_York}
      - BRIDGE_SHARED_SECRET=${BRIDGE_SHARED_SECRET}
      # Paths inside container for NAS scripts + compose bind roots
      - NAS_REPO_ROOT=${NAS_REPO_ROOT:-/nas-repo}
      - PSU_STACK_ROOT=${PSU_STACK_ROOT:-/nas-repo/stacks}
      - STACK_MANAGER_URL=${STACK_MANAGER_URL:-http://10.0.1.15:3866}
      - STACK_MANAGER_USERNAME=${STACK_MANAGER_USERNAME:-}
      - STACK_MANAGER_PASSWORD=${STACK_MANAGER_PASSWORD:-}
      - NAS_PULL_APP_TOKEN=${NAS_PULL_APP_TOKEN:-}
      # Phase 2 PSU API + jobs (see stacks/otspsu/.env.example)
      - PSU_AUTH_TOKEN=${PSU_AUTH_TOKEN:-}
      - PSU_ALLOW_STACK_RESTART=${PSU_ALLOW_STACK_RESTART:-0}
      - PSU_REMEDIATION_ENABLED=${PSU_REMEDIATION_ENABLED:-0}
      - PSU_REMEDIATION_DOCKER_PRUNE=${PSU_REMEDIATION_DOCKER_PRUNE:-0}
      - PSU_REMEDIATION_DISK_THRESHOLD_PCT=${PSU_REMEDIATION_DISK_THRESHOLD_PCT:-90}
      - PSU_REMEDIATION_LOADAVG1_CRITICAL=${PSU_REMEDIATION_LOADAVG1_CRITICAL:-8}
      - PSU_REMEDIATION_MEM_AVAILABLE_RATIO_MIN=${PSU_REMEDIATION_MEM_AVAILABLE_RATIO_MIN:-0.08}
      - PSU_REMEDIATION_DOCKER_CPU_PCT=${PSU_REMEDIATION_DOCKER_CPU_PCT:-90}
      - PSU_REMEDIATION_CPU_TRIAGE=${PSU_REMEDIATION_CPU_TRIAGE:-0}
      - PSU_SAFE_MODE_ENABLED=${PSU_SAFE_MODE_ENABLED:-0}
      - PSU_SAFE_MODE_STOP_STACKS=${PSU_SAFE_MODE_STOP_STACKS:-}
      - PSU_SAFE_MODE_QUEUE_BACKUP=${PSU_SAFE_MODE_QUEUE_BACKUP:-1}
      - PSU_SAFE_MODE_WEBHOOK_URL=${PSU_SAFE_MODE_WEBHOOK_URL:-}
      - PSU_SAFE_MODE_DISCORD_WEBHOOK=${PSU_SAFE_MODE_DISCORD_WEBHOOK:-}
      - PSU_NAS_ALERT_WEBHOOK_TOKEN=${PSU_NAS_ALERT_WEBHOOK_TOKEN:-}
      # Host SSH (optional -- see stacks/otspsu/NAS_HOST_SSH_SETUP.md)
      - NAS_HOST_IP=${NAS_HOST_IP:-}
      - NAS_SSH_USER=${NAS_SSH_USER:-}
      - SSH_KEY_PATH=${SSH_KEY_PATH:-}
      - NAS_HOST_STACKS_ROOT=${NAS_HOST_STACKS_ROOT:-}
      - NAS_SSH_KNOWN_HOSTS_FILE=${NAS_SSH_KNOWN_HOSTS_FILE:-}
      - PSU_GITOPS_ENABLED=${PSU_GITOPS_ENABLED:-0}
      - PSU_GITOPS_AUTO_COMMIT=${PSU_GITOPS_AUTO_COMMIT:-0}
      - PSU_GITOPS_AUTO_PUSH=${PSU_GITOPS_AUTO_PUSH:-0}
      - PSU_GITOPS_COMMIT_MESSAGE=${PSU_GITOPS_COMMIT_MESSAGE:-}
      - PSU_GIT_USER_NAME=${PSU_GIT_USER_NAME:-}
      - PSU_GIT_USER_EMAIL=${PSU_GIT_USER_EMAIL:-}
      - PSU_REPORTS_ROOT=${PSU_REPORTS_ROOT:-/data/reports}
      # Gallery: strict import by default; PSU_GALLERY_OPTIONAL=1 only for staged rollout
      - PSU_GALLERY_OPTIONAL=${PSU_GALLERY_OPTIONAL:-0}
      # PSU_GALLERY_INSTALL=1 runs Install-PSUGalleryModules.ps1 before Universal.Server (needs outbound HTTPS)
      - PSU_GALLERY_INSTALL=${PSU_GALLERY_INSTALL:-0}
      - PSU_GALLERY_INSTALL_STRICT=${PSU_GALLERY_INSTALL_STRICT:-1}
      - PSU_GALLERY_INCLUDE_WINDOWS=${PSU_GALLERY_INCLUDE_WINDOWS:-0}
    entrypoint:
      - /bin/sh
      - /nas-gallery-entrypoint.sh
    volumes:
      - ${STACK_ROOT}/otspsu/scripts/docker-gallery-entrypoint.sh:/nas-gallery-entrypoint.sh:ro
      - ${STACK_ROOT}/otspsu/universal/scripts/Install-PSUGalleryModules.ps1:/install/Install-PSUGalleryModules.ps1:ro
      - ${STACK_ROOT}/otspsu/universal/scripts/Import-PSUGalleryModules.ps1:/install/Import-PSUGalleryModules.ps1:ro
      - ${STACK_ROOT}/otspsu/data:/data:rw
      # Optional: mount read-only private key for host SSH remediation (chmod 600 on host; never commit keys)
      - ${STACK_ROOT}/otspsu/keys:/ssh-keys:ro
      # Repo root (parent of stacks/) for git status + scripts -- same as ${NAS_REPO_ROOT} when set in .env
      - ${NAS_REPO_ROOT:-${STACK_ROOT}/..}:/nas-repo:ro
      - ${ACME_CERT_ROOT:-/volume2/certs/acme}:/certs/acme:ro
    healthcheck:
      # /api/v1/alive returns 200 OK when PSU is ready; root path redirects to login (curl -f fails on 3xx).
      # start_period: 180s covers LiteDB init + gallery entrypoint module import on cold start.
      test:
        - CMD
        - curl
        - -fs
        - http://127.0.0.1:5000/api/v1/alive
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    ports:
      - "10.0.1.15:5570:5000"
    labels:
      # PSU stores session state + job history in LiteDB (/data). A mid-write Watchtower
      # restart risks database file corruption. Update manually after verifying a clean
      # job-queue state and noting the new digest tag for rollback.
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - otspsu-net

  otsagt:
    container_name: otsagt
    image: devolutions/powershell-universal-agent:2026.1.1-ubuntu-lts
    # 2026.1.4 agent tag not yet published by Devolutions -- latest available is 2026.1.1-ubuntu-lts.
    # Bump when Devolutions publishes a matching agent tag for the server version (2026.1.4).
    # Pin digest after pull:
    #   docker pull devolutions/powershell-universal-agent:2026.1.1-ubuntu-lts
    #   docker inspect --format='{{index .RepoDigests 0}}' devolutions/powershell-universal-agent:2026.1.1-ubuntu-lts
    # Then pin: devolutions/powershell-universal-agent@sha256:<digest>
    restart: unless-stopped
    mem_limit: 256m
    cpu_shares: 256
    # cpus: removed - Synology DS723+ kernel lacks CFS scheduler cgroup (NanoCPUs unsupported)
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      # Internal WebSocket connectivity to psu-server (service key: universal)
      - PSU_Connections__0__Url=http://universal:5000
      - PSU_Connections__0__Hub=AgentHub
      # PSU_AGENT_TOKEN: App Token created in PSU Admin -> Security -> App Tokens.
      # Requires the "Agent" role. Never embed the value here; set in .env only.
      # TD-13: token is plaintext in .env -- firewall must block port 5570 from non-LAN hosts.
      - PSU_Connections__0__AppToken=${PSU_AGENT_TOKEN}
    depends_on:
      universal:
        condition: service_healthy
    networks:
      - otspsu-net

networks:
  otspsu-net:
    name: otspsu-net
    driver: bridge
    ipam:
      config:
        # 172.30.0.0/24 taken by zabbix-net. Previous value 172.32.0.0/24 was OUTSIDE
        # RFC1918 (172.16/12 ends at 172.31.255.255) and would mis-route through any
        # future NAT/VPN. 172.31.10.0/24 is the next free RFC1918 /24 in the registry.
        - subnet: 172.31.10.0/24
          gateway: 172.31.10.1
