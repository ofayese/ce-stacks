services:
  github-desktop:
    image: ghcr.io/linuxserver/github-desktop@sha256:f2a11524cde94a66f374f346d06ec2f41e506a5b950e4e0781e73eb4ec631928
    container_name: github-desktop
    hostname: github-desktop
    shm_size: 1g
    # Host-profile fix: 2g → 1536m. KasmVNC + Electron(GitHub Desktop) RSS ~700 MB idle.
    mem_limit: 1536m
    cpu_shares: 512
    cpus: "1.0"
    security_opt:
      # KasmVNC mounts tmpfs and requires unconfined seccomp profile.
      # See docs/dsm-732-runtime-quirks.md §4 — do not remove this line.
      - seccomp:unconfined
      - no-new-privileges:true
    cap_add:
      - IPC_LOCK
    healthcheck:
      # linuxserver/github-desktop KasmVNC listens on port 3001 (not 3000).
      # Confirmed via port forward: target: 3001, published: 3405.
      test:
        - CMD
        - nc
        - -z
        - 127.0.0.1
        - "3001"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    ports:
      - mode: ingress
        host_ip: 10.0.1.15
        target: 3001
        published: "3405"
        protocol: tcp
    volumes:
      - ${STACK_ROOT}/github-desktop/config:/config:rw
    environment:
      - TZ=${TZ:-America/New_York}
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - PIXELFLUX_WAYLAND=0
      - CUSTOM_USER=${GITHUB_DESKTOP_USER:?set GITHUB_DESKTOP_USER in .env}
      - PASSWORD=${GITHUB_DESKTOP_PASSWORD:?set GITHUB_DESKTOP_PASSWORD in .env}
      - TITLE=GitHub Desktop
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - github-desktop-net
networks:
  github-desktop-net:
    # name: override prevents Docker from prepending the project name,
    # which would create "github-desktop_github-desktop-net" (double-name).
    # With name: set, the Docker network is always "github-desktop-net".
    name: github-desktop-net
    driver: bridge
    ipam:
      config:
        # Subnet registry: 172.20.0.0/24 allocated to github-desktop-net (see README.md → Network Subnets)
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
