services:
  code-server:
    # CLAUDE.md S.8 - code-server must use the linuxserver image.
    # Migrated from codercom/code-server:4.117.0-39 (2026-05-13).
    # linuxserver image differences vs codercom:
    #   - Internal port: 8443 (HTTPS with self-signed cert); was 8080
    #   - Config layout: /config (unified); was /home/coder/{.config,.local/share}
    #   - user: directive removed - linuxserver s6-overlay handles PUID/PGID internally
    #   - Added: SUDO_PASSWORD, DEFAULT_WORKSPACE env vars
    #   - Removed: HOME, DOCKER_USER (codercom-specific vars)
    # DSM Reverse Proxy must have WebSocket Custom Headers set (Upgrade + Connection)
    # to prevent connection drops. Timeout: 600s in Application Portal.
    image: ghcr.io/linuxserver/code-server:4.118.0-ls337
    container_name: CodeServer
    # Host-profile fix: 4g -> 3g. Realistic working set for code-server + a couple
    # of Node/TS workspaces is ~1.5 GB; 3g leaves headroom for npm install peaks
    # without crowding the DB sidecars on a 32 GB host.
    mem_limit: 3g
    cpu_shares: 1024
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
    ports:
      - "10.0.1.15:8377:8443"
    volumes:
      # linuxserver unified config dir - replaces separate .config + .local/share mounts
      - ${STACK_ROOT}/code-server/config:/config:rw
      # Removed bash guard syntax to allow Dockhand to inject these bindings
      - ${CODE_SERVER_HOST_DOCKER_BIND}:/config/workspace/docker:rw
      - ${CODE_SERVER_HOST_HOME_BIND}:/config/workspace/home:rw
      # Docker socket - required for Continue MCP_DOCKER gateway (docker mcp gateway run)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Explicitly map all variables and secrets so Dockhand can inject them
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DOCKER_USER=${DOCKER_USER}
      - BRIDGE_SHARED_SECRET=${BRIDGE_SHARED_SECRET}
      - PASSWORD=${CODE_SERVER_PASSWORD}
      - SUDO_PASSWORD=${SUDO_PASSWORD}
      - PROXY_DOMAIN=${PROXY_DOMAIN}
    labels:
      - haproxy.enable=true
      - haproxy.host=code.olutechsys.com,code.olutech.systems,code.otsorundscore.olutechsys.com,code.otsorundscore.olutech.systems
      - haproxy.port=8377
      - haproxy.backend=codeserver-be
    networks:
      - code-server-net

  db:
    image: mysql:8.3
    container_name: CodeServerDB
    # Host-profile fix: 2g -> 1g. Dev-only MySQL; InnoDB buffer pool defaults to
    # 128 MB and small dev datasets rarely exceed 200 MB resident.
    mem_limit: 1g
    cpu_shares: 512
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
    ports:
      - "10.0.1.15:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ${STACK_ROOT}/code-server/config/mysql-init:/docker-entrypoint-initdb.d:ro
    environment:
      # Pure syntax required for full Dockhand .env parser compatibility
      - PUID=${PUID}
      - PGID=${PGID}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${PMA_CONTROLPASS}
      - TZ=${TZ}
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -uroot
        - --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      # GAP-03 fix: NEVER auto-upgrade databases. MySQL major version bumps (8.3->8.4+)
      # require explicit in-place upgrade. A cold image swap can corrupt InnoDB data files.
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - code-server-net

  phpmyadmin:
    image: phpmyadmin:5.2.2-apache
    container_name: CodeServerPMA
    mem_limit: 512m
    cpu_shares: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
    ports:
      # 8379: avoids port conflict with db-tools/PhpMyAdmin (10.0.1.15:8378 -> native MariaDB).
      # CodeServerPMA targets the code-server MySQL sidecar (port 3307 internal).
      - "10.0.1.15:8379:80"
    volumes:
      - ${STACK_ROOT}/code-server/config/phpmyadmin:/etc/phpmyadmin:rw
      - ${STACK_ROOT}/code-server/data/phpmyadmin_sessions:/sessions:rw
    environment:
      # Pure syntax required for full Dockhand .env parser compatibility
      - PUID=${PUID}
      - PGID=${PGID}
      - PMA_HOST=db
      - PMA_PORT=3306
      - PMA_CONTROLUSER=${PMA_CONTROLUSER}
      - PMA_CONTROLPASS=${PMA_CONTROLPASS}
      - PMA_BLOWFISH_SECRET=${PMA_BLOWFISH_SECRET}
      - PMA_ABSOLUTE_URI=${PMA_ABSOLUTE_URI}
      - HIDE_PHP_VERSION=1
      - TZ=${TZ}
    healthcheck:
      test:
        - CMD
        - curl
        - -fs
        - http://localhost/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - haproxy.enable=true
      - haproxy.host=pma.olutechsys.com,pma.olutech.systems,pma.otsorundscore.olutechsys.com,pma.otsorundscore.olutech.systems
      - haproxy.port=8379
      - haproxy.backend=phpmyadmin-be
    networks:
      - code-server-net

### GAP-08: Docker file-based secrets for code-server credentials.
### Populate: see stacks/code-server/secrets/README.md
secrets:
  code_server_password:
    file: ${STACK_ROOT}/code-server/secrets/code_server_password.txt
  sudo_password:
    file: ${STACK_ROOT}/code-server/secrets/sudo_password.txt

volumes:
  mysql_data:
    driver: local

networks:
  code-server-net:
    name: code-server-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.2.0/24
          gateway: 172.28.2.1