services:
  redis:
    container_name: SearXNG-Redis
    image: valkey/valkey:8.0.2-alpine
    mem_limit: 256m
    cpu_shares: 512
    # cpus: removed - Synology DS723+ kernel lacks CFS scheduler cgroup (NanoCPUs unsupported)
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command: valkey-server --save "" --appendonly no
    # NOTE: vm.overcommit_memory and net.core.somaxconn cannot be set via
    # compose sysctls on Synology DSM - the kernel does not namespace these.
    # Set them at the host level via DSM Task Scheduler (run as root at boot):
    #   sysctl vm.overcommit_memory=1
    #   sysctl net.core.somaxconn=512
    # See stacks/searxng/README.md for Task Scheduler setup instructions.
    # The warnings are cosmetic - Valkey starts successfully without these.
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - searxng-net

  searxng:
    container_name: SearXNG
    image: searxng/searxng:2026.4.29-cba0cffa8
    # NAS baseline: run as root so first-boot can create /etc/searxng/settings.yaml
    # on the bind-mounted config directory.
    user: 0:0
    mem_limit: 512m
    cpu_shares: 768
    # cpus: removed - Synology DS723+ kernel lacks CFS scheduler cgroup (NanoCPUs unsupported)
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "10.0.1.15:8888:8080"
    volumes:
      - ${STACK_ROOT}/searxng/config:/etc/searxng:rw
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL}
      - SEARXNG_REDIS_URL=redis://redis:6379/0
      - UWSGI_WORKERS=${UWSGI_WORKERS}
      - UWSGI_THREADS=${UWSGI_THREADS}
      - TZ=${TZ}
    healthcheck:
      # searxng uWSGI listens on 8080; /healthz is not available — probe TCP port directly
      # to bypass strict HTTP Host header validation when SEARXNG_BASE_URL is set.
      # nc -z is GNU netcat only; BusyBox nc uses -w <timeout> with stdin from /dev/null.
      test: ["CMD-SHELL", "nc -w 1 127.0.0.1 8080 </dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - haproxy.enable=true
      - haproxy.host=search.olutechsys.com,search.olutech.systems,search.otsorundscore.olutechsys.com,search.otsorundscore.olutech.systems
      - haproxy.port=8888
      - haproxy.backend=searxng-be
    networks:
      - searxng-net

networks:
  searxng-net:
    name: searxng-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.4.0/24
          gateway: 172.31.4.1