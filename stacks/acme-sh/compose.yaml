services:
  acme-sh:
    image: neilpang/acme.sh:3.1.3
    container_name: AcmeSh
    mem_limit: 128m
    cpu_shares: 256
    # cpus: removed -- Synology DS723+ kernel lacks CFS scheduler cgroup (NanoCPUs unsupported)
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/acme-sh-entrypoint.sh"]
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - TZ=America/New_York
    network_mode: host
    volumes:
      - ${STACK_ROOT}/acme-sh/data:/acme.sh
      - ${ACME_CERT_ROOT:-/volume2/certs/acme}:/volume2/certs/acme
      - ${STACK_ROOT}/acme-sh/scripts/docker-entrypoint.sh:/acme-sh-entrypoint.sh:ro
      # Bind-mount the raw secrets directory so any file inside is readable by
      # scripts running in the container. Individual secrets are also injected
      # at /run/secrets/<name> via the Docker secrets block below.
      - ${STACK_ROOT}/acme-sh/secrets:/acme-sh/secrets:ro
    command: daemon
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    secrets:
      - cf_token
      - discord_webhook_url

secrets:
  cf_token:
    file: "${STACK_ROOT}/acme-sh/secrets/cf_token.txt"
  discord_webhook_url:
    file: "${STACK_ROOT}/acme-sh/secrets/discord_webhook_url.txt"
