global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      # Scrapes your SynoCommunity package directly on the NAS host OS
      - targets: ["10.0.1.15:9100"]

  # ntopng metrics flow through InfluxDB, not Prometheus scrape.
  # ntopng -> InfluxDB 1.8 (10.0.1.15:8086) -> Grafana (InfluxDB-ntopng datasource)
  # See stacks/influxdb/ for setup and stacks/grafana-prom/provisioning/datasources/influxdb.yml.
  #
  # ntopng >=5.6 (Community) does expose a Prometheus endpoint, but it requires
  # basic auth and a non-standard path. To enable it, uncomment and configure:
  #
  # - job_name: "ntopng"
  #   metrics_path: /lua/rest/v2/get/metrics/prometheus.lua
  #   basic_auth:
  #     username: admin
  #     password: <ntopng-admin-password>
  #   static_configs:
  #     - targets: ["10.0.1.15:3000"]

  - job_name: "snmp-exporter"
    static_configs:
      - targets: ["prometheus-snmp:9116"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["prometheus-cadvisor:8080"]

  - job_name: "nas"
    scrape_interval: 30s
    static_configs:
      - targets: ["10.0.1.15:161"]
        labels:
          instance: otsorundscore
      - targets: ["10.0.1.24:161"]
        labels:
          instance: misfitsds
    metrics_path: /snmp
    params:
      module: [synology]
      auth: [public_v3]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: prometheus-snmp:9116

  - job_name: "watchtower"
    scrape_interval: 10m
    metrics_path: /v1/metrics
    bearer_token_file: /etc/prometheus/watchtower_bearer_token
    static_configs:
      - targets: ["10.0.1.15:18787"]