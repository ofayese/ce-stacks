global:
  resolve_timeout: 5m

route:
  receiver: discord-nas
  group_by: ['alertname', 'instance', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: discord-nas
      repeat_interval: 1h

receivers:
  - name: discord-nas
    discord_configs:
      - webhook_url: '${DISCORD_WEBHOOK_URL:-http://localhost}'
        send_resolved: true
        title: >-
          {{ if eq .Status "firing" }}🔥 FIRING{{ else }}✅ RESOLVED{{ end }} [{{ .CommonLabels.alertname }}]
        message: |
          {{ range .Alerts }}
          **Alert:** {{ .Labels.alertname }}
          **Severity:** {{ .Labels.severity | toUpper }}
          **Instance:** {{ .Labels.instance | default "N/A" }}
          **Summary:** {{ .Annotations.summary }}
          {{ if .Annotations.description -}}
          **Detail:** {{ .Annotations.description }}
          {{ end -}}
          **Started:** {{ .StartsAt | since | humanizeDuration }} ago
          {{ end }}

inhibit_rules:
  - source_matchers:
      - alertname="PrometheusTargetDown"
    target_matchers:
      - alertname=~"NASMemoryPressure|NASHighLoad"
    equal: ['job']