# Alertmanager configuration — ce-stacks NAS monitoring
# GAP-04 fix: deploy alongside Prometheus to get proactive alerting.
#
# SETUP:
#   1. Set DISCORD_WEBHOOK_URL in stacks/grafana-prom/.env
#      (Settings → Integrations → Webhooks in your Discord server)
#   2. Replace REPLACE_WITH_DISCORD_WEBHOOK_URL below with your webhook URL
#      (e.g. https://discord.com/api/webhooks/1234567890/AbCdEfGh...)
#   3. docker compose up -d alertmanager
#   4. Verify at http://10.0.1.15:9093

global:
  # How long to wait before declaring a resolved alert truly resolved
  resolve_timeout: 5m

# Default routing tree — all alerts go to Discord unless overridden
route:
  receiver: discord-nas
  group_by: ['alertname', 'instance', 'job']
  group_wait: 30s        # wait 30s to batch alerts before first send
  group_interval: 5m     # minimum time before re-sending for same group
  repeat_interval: 4h    # re-alert every 4h if still firing

  # Override for critical alerts: re-alert every 1h
  routes:
    - matchers:
        - severity="critical"
      receiver: discord-nas
      repeat_interval: 1h

receivers:
  - name: discord-nas
    discord_configs:
      - webhook_url: 'REPLACE_WITH_DISCORD_WEBHOOK_URL'
        send_resolved: true
        title: >-
          {{ if eq .Status "firing" }}🔴 FIRING{{ else }}✅ RESOLVED{{ end }}
          [{{ .CommonLabels.alertname }}]
        message: |
          {{ range .Alerts }}
          **Alert:** {{ .Labels.alertname }}
          **Severity:** {{ .Labels.severity | toUpper }}
          **Instance:** {{ .Labels.instance | default "N/A" }}
          **Summary:** {{ .Annotations.summary }}
          {{ if .Annotations.description -}}
          **Detail:** {{ .Annotations.description }}
          {{ end -}}
          **Started:** {{ .StartsAt | since | humanizeDuration }} ago
          {{ end }}

# Inhibition rules prevent alert storms
inhibit_rules:
  # If a job is down, suppress target-level alerts from that job
  - source_matchers:
      - alertname="PrometheusTargetDown"
    target_matchers:
      - alertname=~"NASMemoryPressure|NASHighLoad"
    equal: ['job']
