# snmp.yml — prom/snmp-exporter v0.30.x compatible
# Generated format: each metric requires oid + type.
# Auth: SNMPv3 credentials must be set to match your NAS DSM SNMPv3 config.
# DSM → Control Panel → Terminal & SNMP → SNMP → SNMPv3 tab.
#
# To update credentials, edit the public_v3 auth block below.
# auth_protocol: MD5 | SHA | SHA224 | SHA256 | SHA384 | SHA512
# priv_protocol: DES | AES | AES192 | AES256

auths:
  public_v3:
    community: public
    security_level: authPriv
    # Plain ${VAR} syntax required — snmp-exporter's --config.expand-env uses
    # Go os.ExpandEnv which does not support the ${VAR:-default} shell fallback form.
    # Actual values must be set in .env (see .env.example: SNMP_USERNAME, SNMP_AUTH_PASSWORD,
    # SNMP_PRIV_PASSWORD) and are injected into the container via compose.yaml environment block.
    username: ${SNMP_USERNAME}
    password: ${SNMP_AUTH_PASSWORD}
    auth_protocol: SHA
    priv_protocol: AES
    priv_password: ${SNMP_PRIV_PASSWORD}
    version: 3

modules:
  synology:
    walk:
      - 1.3.6.1.2.1.1          # system
      - 1.3.6.1.2.1.2          # interfaces
      - 1.3.6.1.2.1.31.1.1     # ifXTable
      - 1.3.6.1.4.1.2021.4     # memTable (UCD-SNMP-MIB)
      - 1.3.6.1.4.1.2021.10    # laTable (load average)
      - 1.3.6.1.4.1.2021.11    # systemStats (CPU)
      - 1.3.6.1.4.1.2021.13.15 # diskIOTable
      - 1.3.6.1.4.1.6574.1     # synoSystem
      - 1.3.6.1.4.1.6574.2     # synoDisk
      - 1.3.6.1.4.1.6574.3     # synoRaid
      - 1.3.6.1.4.1.6574.5     # synoUPS
      - 1.3.6.1.4.1.6574.6     # synologyStorageIO
    metrics:
      # ── System ──────────────────────────────────────────────────────────
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3.0
        type: gauge
        help: The time (in hundredths of a second) since the network management portion of the system was last re-initialized
      - name: sysDescr
        oid: 1.3.6.1.2.1.1.1.0
        type: DisplayString
        help: A textual description of the entity
      - name: sysName
        oid: 1.3.6.1.2.1.1.5.0
        type: DisplayString
        help: An administratively assigned name for this managed node

      # ── Interfaces ──────────────────────────────────────────────────────
      - name: ifAdminStatus
        oid: 1.3.6.1.2.1.2.2.1.7
        type: gauge
        help: The desired state of the interface
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            labelname: ifDescr
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifOperStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        help: The current operational state of the interface
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            labelname: ifDescr
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifInOctets
        oid: 1.3.6.1.2.1.2.2.1.10
        type: counter
        help: The total number of octets received on the interface
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            labelname: ifDescr
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifOutOctets
        oid: 1.3.6.1.2.1.2.2.1.16
        type: counter
        help: The total number of octets transmitted out of the interface
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            labelname: ifDescr
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifInErrors
        oid: 1.3.6.1.2.1.2.2.1.14
        type: counter
        help: The number of inbound packets that contained errors
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            labelname: ifDescr
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
      - name: ifOutErrors
        oid: 1.3.6.1.2.1.2.2.1.20
        type: counter
        help: The number of outbound packets that could not be transmitted because of errors
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            labelname: ifDescr
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString

      # ── Memory (UCD-SNMP-MIB) ────────────────────────────────────────────
      - name: memTotalReal
        oid: 1.3.6.1.4.1.2021.4.5.0
        type: gauge
        help: Total RAM in machine
      - name: memAvailReal
        oid: 1.3.6.1.4.1.2021.4.6.0
        type: gauge
        help: Available RAM
      - name: memTotalSwap
        oid: 1.3.6.1.4.1.2021.4.3.0
        type: gauge
        help: Total swap space configured
      - name: memAvailSwap
        oid: 1.3.6.1.4.1.2021.4.4.0
        type: gauge
        help: Available swap space
      - name: memBuffer
        oid: 1.3.6.1.4.1.2021.4.14.0
        type: gauge
        help: Memory used for buffer purposes
      - name: memCached
        oid: 1.3.6.1.4.1.2021.4.15.0
        type: gauge
        help: Memory used for caching purposes

      # ── CPU (UCD-SNMP-MIB) ──────────────────────────────────────────────
      - name: ssCpuUser
        oid: 1.3.6.1.4.1.2021.11.9.0
        type: gauge
        help: Percentage of CPU time spent processing user-level code
      - name: ssCpuSystem
        oid: 1.3.6.1.4.1.2021.11.10.0
        type: gauge
        help: Percentage of CPU time spent processing system-level code
      - name: ssCpuIdle
        oid: 1.3.6.1.4.1.2021.11.11.0
        type: gauge
        help: Percentage of CPU time spent idle

      # ── Load average (UCD-SNMP-MIB) ─────────────────────────────────────
      - name: laLoad
        oid: 1.3.6.1.4.1.2021.10.1.3
        type: DisplayString
        help: The load average as a string
        indexes:
          - labelname: laIndex
            type: gauge
        lookups:
          - labels: [laIndex]
            labelname: laNames
            oid: 1.3.6.1.4.1.2021.10.1.2
            type: DisplayString

      # ── Synology system (SYNOLOGY-SYSTEM-MIB) ───────────────────────────
      - name: synoSystemCpuFanStatus
        oid: 1.3.6.1.4.1.6574.1.4.1.0
        type: gauge
        help: CPU fan status (1=Normal, 2=Failed)
      - name: synoSystemSystemFanStatus
        oid: 1.3.6.1.4.1.6574.1.4.2.0
        type: gauge
        help: System fan status (1=Normal, 2=Failed)
      - name: synoSystemPowerStatus
        oid: 1.3.6.1.4.1.6574.1.3.0
        type: gauge
        help: Power status (1=Normal, 2=Failed)
      - name: synoSystemTemperature
        oid: 1.3.6.1.4.1.6574.1.2.0
        type: gauge
        help: System temperature in Celsius
      - name: synoSystemUpgradeAvailable
        oid: 1.3.6.1.4.1.6574.1.5.4.0
        type: gauge
        help: DSM upgrade available (1=Available, 2=Unavailable, 3=Connecting, 4=Disconnected, 5=Others)

      # ── Synology disk (SYNOLOGY-DISK-MIB) ───────────────────────────────
      - name: synoDiskName
        oid: 1.3.6.1.4.1.6574.2.1.1.2
        type: DisplayString
        help: Disk name
        indexes:
          - labelname: diskIndex
            type: gauge
      - name: synoDiskStatus
        oid: 1.3.6.1.4.1.6574.2.1.1.5
        type: gauge
        help: Disk status (1=Normal, 2=Initialized, 3=NotInitialized, 4=SystemPartitionFailed, 5=Crashed)
        indexes:
          - labelname: diskIndex
            type: gauge
        lookups:
          - labels: [diskIndex]
            labelname: synoDiskName
            oid: 1.3.6.1.4.1.6574.2.1.1.2
            type: DisplayString
      - name: synoDiskTemperature
        oid: 1.3.6.1.4.1.6574.2.1.1.6
        type: gauge
        help: Disk temperature in Celsius
        indexes:
          - labelname: diskIndex
            type: gauge
        lookups:
          - labels: [diskIndex]
            labelname: synoDiskName
            oid: 1.3.6.1.4.1.6574.2.1.1.2
            type: DisplayString

      # ── Synology RAID (SYNOLOGY-RAID-MIB) ───────────────────────────────
      - name: synoRaidName
        oid: 1.3.6.1.4.1.6574.3.1.1.2
        type: DisplayString
        help: RAID volume name
        indexes:
          - labelname: raidIndex
            type: gauge
      - name: synoRaidStatus
        oid: 1.3.6.1.4.1.6574.3.1.1.3
        type: gauge
        help: RAID status (1=Normal, 2=Repairing, 3=Migrating, 4=Expanding, 5=Deleting, 6=Creating, 7=RaidSyncing, 8=RaidParityChecking, 9=RaidAssembling, 10=Canceling, 11=Degrade, 12=Crashed)
        indexes:
          - labelname: raidIndex
            type: gauge
        lookups:
          - labels: [raidIndex]
            labelname: synoRaidName
            oid: 1.3.6.1.4.1.6574.3.1.1.2
            type: DisplayString

      # ── Synology UPS (SYNOLOGY-UPS-MIB) ─────────────────────────────────
      - name: synoUPSDeviceModel
        oid: 1.3.6.1.4.1.6574.5.1.1.1.0
        type: DisplayString
        help: UPS device model
      - name: synoUPSBatteryChargeValue
        oid: 1.3.6.1.4.1.6574.5.1.1.13.0
        type: gauge
        help: UPS battery charge percentage
      - name: synoUPSBatteryRuntimeValue
        oid: 1.3.6.1.4.1.6574.5.1.1.15.0
        type: gauge
        help: UPS battery runtime remaining in seconds
