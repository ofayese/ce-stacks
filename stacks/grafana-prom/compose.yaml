services:
  grafana:
    image: grafana/grafana:13.0.1
    container_name: Grafana
    hostname: grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - grafana-net
      - ce-internal
    mem_limit: 512m
    cpu_shares: 512
    security_opt:
      - no-new-privileges:true
    user: "${PUID:-0}:${PGID:-0}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    ports:
      - "${NAS_IP:-10.0.1.15}:${GRAFANA_PORT:-3340}:3000"
    volumes:
      - ${STACK_ROOT}/grafana-prom/data/grafana:/var/lib/grafana:rw
      - ${STACK_ROOT}/grafana-prom/provisioning:/etc/grafana/provisioning:ro
      # MariaDB Unix socket — avoids TCP/firewall issues entirely
      - /run/mysqld/mysqld10.sock:/run/mysqld/mysqld.sock:ro
      - ${STACK_ROOT}/grafana-prom/secrets/influxdb_grafana_password.txt:/run/secrets/influxdb_grafana_password:ro
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - TZ=${TIMEZONE:-America/New_York}
      # MariaDB via Unix socket (Synology MariaDB 10 package)
      - GF_DATABASE_TYPE=mysql
      - GF_DATABASE_HOST=${MYSQL_HOST:-/run/mysqld/mysqld.sock}
      - GF_DATABASE_NAME=${GRAFANA_DB_NAME}
      - GF_DATABASE_USER=${GRAFANA_DB_USER}
      - GF_DATABASE_PASSWORD=${GRAFANA_DB_PASSWORD}
      - GF_DATABASE_SSL_MODE=disable
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false
      - dockhand.url=http://10.0.1.15:${GRAFANA_PORT:-3340}
      - haproxy.enable=true
      - haproxy.host=grafana.olutechsys.com,grafana.olutech.systems
      - haproxy.port=${GRAFANA_PORT:-3340}
      - haproxy.backend=grafana-be
      - haproxy.check.path=/api/health

  prometheus:
    image: prom/prometheus:v3.11.3
    command:
      - "--storage.tsdb.retention.time=60d"
      - "--config.file=/etc/prometheus/prometheus.yml"
    container_name: Prometheus
    hostname: prometheus-server
    networks:
      - grafana-net
      - prometheus-net
      - ce-internal
    mem_limit: 1g
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    user: "${PUID:-0}:${PGID:-0}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - TZ=${TIMEZONE:-America/New_York}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9090/"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - ${STACK_ROOT}/grafana-prom/data/prometheus:/prometheus:rw
      - ${STACK_ROOT}/grafana-prom/prom.yml:/etc/prometheus/prometheus.yml:ro
      - ${STACK_ROOT}/grafana-prom/alerts:/etc/prometheus/alerts:ro
      - ${STACK_ROOT}/grafana-prom/secrets/watchtower_bearer_token.txt:/etc/prometheus/watchtower_bearer_token:ro
    ports:
      - "${NAS_IP:-10.0.1.15}:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false
      - dockhand.update=false
    depends_on:
      snmp-exporter:
        condition: service_healthy
      cadvisor:
        condition: service_healthy
      alertmanager:
        condition: service_healthy

  snmp-exporter:
    image: prom/snmp-exporter:v0.30.1
    command:
      - "--config.file=/etc/snmp_exporter/snmp.yml"
      - "--config.expand-environment-variables"
    container_name: Prometheus-SNMP
    hostname: prometheus-snmp
    networks:
      - prometheus-net
    mem_limit: 256m
    mem_reservation: 64m
    cpu_shares: 512
    security_opt:
      - no-new-privileges:true
    read_only: true
    user: "${PUID:-0}:${PGID:-0}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - SNMP_USERNAME=${SNMP_USERNAME}
      - SNMP_AUTH_PASSWORD=${SNMP_AUTH_PASSWORD}
      - SNMP_PRIV_PASSWORD=${SNMP_PRIV_PASSWORD}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9116/"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ${STACK_ROOT}/grafana-prom/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    command:
      - "--docker_only=true"
    container_name: Prometheus-cAdvisor
    hostname: prometheus-cadvisor
    networks:
      - prometheus-net
    mem_limit: 256m
    mem_reservation: 64m
    cpu_shares: 512
    security_opt:
      - no-new-privileges:true
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/healthz"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: Alertmanager
    hostname: alertmanager
    mem_limit: 128m
    cpu_shares: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=0.0.0.0:9093"
    ports:
      - "${NAS_IP:-10.0.1.15}:9093:9093"
    volumes:
      - ${STACK_ROOT}/grafana-prom/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${STACK_ROOT}/grafana-prom/data/alertmanager:/alertmanager:rw
      - ${STACK_ROOT}/grafana-prom/secrets/discord_webhook_url.txt:/run/secrets/discord_webhook_url:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:9093/-/healthy"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - TZ=${TZ:-America/New_York}
    networks:
      - grafana-net
      - prometheus-net
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=false

  wireguard-exporter:
    image: docker.io/mindflavor/prometheus-wireguard-exporter:3.6.6
    container_name: Prometheus-WireGuard-Exporter
    hostname: prometheus-wireguard
    network_mode: host
    cap_add:
      - NET_ADMIN
    command:
      - --address
      - "127.0.0.1"
      - --port
      - "9586"
      - --interfaces
      - "wg0"
      - --prepend_sudo
      - "false"
    restart: unless-stopped
    mem_limit: 64m
    cpu_shares: 128
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  grafana-net:
    name: grafana-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
          gateway: 172.29.0.1
  prometheus-net:
    name: prometheus-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.1.0/24
          gateway: 172.29.1.1
  ce-internal:
    external: true
