# Grafana datasource provisioning — InfluxDB (ntopng time-series)
# Auto-provisioned on Grafana startup; no manual UI steps required.
#
# InfluxDB is queried via the NAS host IP (proxy access) because InfluxDB
# is a separate stack with no shared Docker network with grafana-prom.
#
# Password is read from a secret file mounted into the Grafana container:
#   secrets/influxdb_grafana_password.txt → /run/secrets/influxdb_grafana_password
# $__file{} is the Grafana ≥8 secret-file interpolation syntax (no env var needed).
# The file must match INFLUXDB_GRAFANA_PASSWORD in stacks/influxdb/.env.
apiVersion: 1

datasources:
  - name: InfluxDB-ntopng
    type: influxdb
    uid: influxdb-ntopng
    url: http://10.0.1.15:8086
    access: proxy
    # Database name must match INFLUXDB_DATABASE in stacks/influxdb/.env
    database: ntopng
    isDefault: false
    editable: false
    user: grafana
    secureJsonData:
      password: $__file{/run/secrets/influxdb_grafana_password}
    jsonData:
      httpMode: GET
      timeInterval: "30s"
