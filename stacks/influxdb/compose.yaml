services:
  influxdb:
    image: influxdb:1.8.10
    container_name: InfluxDB
    hostname: influxdb
    security_opt:
      - no-new-privileges:true
    # InfluxDB 1.8 entrypoint runs as root first (chowns /var/lib/influxdb to
    # influxdb:influxdb via gosu), so PUID=0 is correct and does not cause
    # permission conflicts with the bind mount.
    user: "${PUID:-0}:${PGID:-0}"
    mem_limit: 1g
    cpu_shares: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # ntopng (native NAS package) writes here from the host OS — needs host-published port.
      - "10.0.1.15:8086:8086"
    networks:
      # ce-internal allows Grafana to reach InfluxDB by container name (influxdb:8086)
      # without relying on host-IP routing from inside bridge networks (unreliable on Synology DSM).
      - ce-internal
    volumes:
      - ${STACK_ROOT}/influxdb/data:/var/lib/influxdb:rw
    environment:
      - INFLUXDB_HTTP_AUTH_ENABLED=true
      # Admin — management only; do not use for application writes or reads
      - INFLUXDB_ADMIN_USER=${INFLUXDB_ADMIN_USER}
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      # Default database created on first start.
      # Must match the database name configured in ntopng → Settings → Timeseries → InfluxDB.
      - INFLUXDB_DB=${INFLUXDB_DATABASE:-ntopng}
      # Write-only user for ntopng — use these credentials in ntopng's InfluxDB export config
      - INFLUXDB_WRITE_USER=ntopng
      - INFLUXDB_WRITE_USER_PASSWORD=${INFLUXDB_NTOPNG_PASSWORD}
      # Read-only user for Grafana — auto-provisioned via grafana-prom/provisioning/datasources/influxdb.yml
      - INFLUXDB_READ_USER=grafana
      - INFLUXDB_READ_USER_PASSWORD=${INFLUXDB_GRAFANA_PASSWORD}
      - TZ=${TZ:-America/New_York}
    healthcheck:
      # /ping returns HTTP 204 without requiring authentication — safe with auth enabled
      test: ["CMD", "curl", "-sf", "http://localhost:8086/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    labels:
      # Stateful time-series DB — never auto-update; version pin is intentional
      - com.centurylinklabs.watchtower.enable=false

networks:
  ce-internal:
    external: true
