# Redis configuration — Native DSM package reference
# Live path: /var/packages/redis/var/redis.conf
# Data path: /volume1/@appdata/redis
#
# This file documents the NON-DEFAULT settings applied to the Synology DSM Redis
# package. It is a reference only — edit the live file on the NAS to apply changes.
#
# Changes from Redis upstream defaults are marked with [CHANGED] comments.
# Settings preserved from the DSM default are marked with [DSM DEFAULT].
# ─────────────────────────────────────────────────────────────────────────────

# ─── NETWORK ─────────────────────────────────────────────────────────────────

# Listen on all interfaces so Docker bridge containers (172.16.0.0/12) can reach
# Redis in addition to loopback and LAN clients.
# [DSM DEFAULT — already correct]
bind 0.0.0.0

# [CHANGED from: protected-mode yes]
# With bind 0.0.0.0 and no password set, protected-mode yes silently blocks
# every non-loopback client — including Docker bridge containers at 172.x.x.x.
# This NAS is not directly internet-exposed; the router has no inbound port-
# forwarding to 6379. Setting protected-mode no is the correct fix.
# If this NAS is ever directly internet-exposed, set requirepass instead.
protected-mode no

port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ─── GENERAL ─────────────────────────────────────────────────────────────────

# [DSM DEFAULT] — native DSM service, not a container
daemonize yes

pidfile "/var/packages/redis/var/redis.pid"
loglevel notice
logfile "/var/packages/redis/var/redis.log"
syslog-enabled no
syslog-ident "redis"
syslog-facility local0
databases 16
always-show-logo no
set-proc-title yes

# ─── MEMORY ──────────────────────────────────────────────────────────────────

# [CHANGED from: commented out / unlimited]
# Set a 512 MB cap to prevent runaway memory growth on the 32 GB NAS.
# Redis here is a cache workload (DSM packages, SearXNG — but see README).
maxmemory 512mb

# [CHANGED from: noeviction (default)]
# Evict least-recently-used keys across all keyspaces when maxmemory is hit.
# Appropriate for a cache where losing data is acceptable.
maxmemory-policy allkeys-lru

# ─── SNAPSHOTTING (RDB) ──────────────────────────────────────────────────────

# [CHANGED from: RDB saves (DSM default)]
# Disable RDB persistence entirely. Redis here is a cache, not a durable
# store; losing data on crash is acceptable. Eliminates unnecessary disk I/O
# on the NAS volume.
save ""

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename "dump.rdb"
dir "/volume1/@appdata/redis"

# ─── APPEND ONLY FILE (AOF) ──────────────────────────────────────────────────

# [DSM DEFAULT] AOF disabled — no persistence is needed for a cache workload.
appendonly no

# ─── USERS / AUTH ────────────────────────────────────────────────────────────

# [DSM DEFAULT] — Default user has no password; access is restricted to the
# private LAN by the bind address. Do not expose port 6379 to the internet.
#
# The following line is auto-managed by DSM — do not edit manually:
# user default on nopass sanitize-payload ~* &* +@all
