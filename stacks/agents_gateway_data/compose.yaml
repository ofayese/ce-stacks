services:
  mcp-gateway:
    image: docker/mcp-gateway:v0.42.0
    command:
      - --servers=duckduckgo
      - --transport=streaming
    mem_limit: 512m
    cpu_shares: 512
    cpus: "0.5"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    ports:
      - 10.0.1.15:8812:8811
    volumes:
      # /var/run socket context
      # Host-profile fix: dropped :rw → :ro. Gateway reads container metadata only.
      # If a future tool container truly needs :rw, front the socket with
      # tecnativa/docker-socket-proxy (defense in depth — see README).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Healthcheck type: A - HTTP /health probe (wget - verified 2026-05-07)
    # Host publishes 8812→8811; in-container probe stays on 8811. Upstream example uses /health.
    # Source: https://raw.githubusercontent.com/docker/mcp-gateway/main/examples/health/compose.yaml
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8811/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - TZ=America/New_York
      - OLLAMA_API_BASE_URL=${OLLAMA_API_BASE_URL}
      - BRIDGE_SHARED_SECRET=${BRIDGE_SHARED_SECRET}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    # GAP-02 fix: add ce-internal so mcp-gateway can resolve ollama:11434 by DNS.
    # Without ce-internal, agentic flows that invoke local LLM tools fail silently
    # because agents-gateway-net has no route to ollama-net or ce-internal.
    networks:
      - agents-gateway-net
      - ce-internal
networks:
  agents-gateway-net:
    name: agents-gateway-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.7.0/24
          gateway: 172.31.7.1
  ce-internal:
    external: true
