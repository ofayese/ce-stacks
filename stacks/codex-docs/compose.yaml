services:
  mongodb:
    container_name: CodexDocs-MongoDB
    image: mongo:7.0.21
    mem_limit: 512m
    cpu_shares: 512
    # cpus: removed - Synology DS723+ kernel lacks CFS scheduler cgroup (NanoCPUs unsupported)
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    volumes:
      - ${STACK_ROOT}/codex-docs/db:/data/db:rw
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - MONGO_INITDB_DATABASE=codexdocs
      - TZ=America/New_York
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - codex-docs-net

  codex-docs:
    container_name: CodexDocs
    # Upstream publishes rolling tags; pin when a semver tag is available.
    image: ghcr.io/codex-team/codex.docs@sha256:c25f47c7f5af84206cef1fcedb2debcd25ba9ce1d4c6e5a33a0f273faff5a41f
    mem_limit: 256m
    cpu_shares: 256
    # cpus: removed - Synology DS723+ kernel lacks CFS scheduler cgroup (NanoCPUs unsupported)
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "10.0.1.15:8896:3000"
    volumes:
      - ${STACK_ROOT}/codex-docs/data:/usr/src/app/uploads:rw
      - ${STACK_ROOT}/codex-docs/docs-config.yaml:/usr/src/app/docs-config.yaml:ro
    env_file:
      - .env
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - MONGODB_URI=mongodb://mongodb:27017/codexdocs
      - "APP_SECRET=${APP_SECRET:?set APP_SECRET in .env - generate with openssl rand -hex 32}"
      - PORT=3000
      - TZ=America/New_York
    healthcheck:
      # curl is absent from the minimal Node.js image; use wget (present in Alpine/Debian slim).
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      mongodb:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "otsorundscore.olutechsys.com:10.0.1.15"
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - codex-docs-net
networks:
  codex-docs-net:
    name: codex-docs-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.6.0/24
          gateway: 172.31.6.1
