services:
  ollama:
    container_name: otsai
    # DS723+: AMD Ryzen R1600 (2 cores / 4 threads), 32 GB RAM, CPU-only.
    # PINNED: floating :latest is dangerous on a stateful model store. Refresh
    # this digest manually after testing on a non-prod host; this also gates
    # Watchtower from auto-pulling (mid-pull restart corrupts model blobs).
    # To refresh: docker pull ollama/ollama:0.4.7 ; docker inspect ...
    image: ollama/ollama:0.4.7
    # Host-profile fix (otsorundscore, 32 GB / 2c): lowered 14g -> 10g, reservation
    # 8g -> 6g. 7B-Q4 models RSS ~5-6 GB; 10g leaves 4 GB KV cache headroom and
    # recovers 4 GB for DSM + other stacks on this 2-core CPU-only host.
    mem_limit: 10g
    mem_reservation: 6g
    cpu_shares: 1024
    # Hard cap: never let Ollama pin both cores under sustained inference (Cool mode).
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
    ports:
      - 10.0.1.15:11434:11434
    networks:
      - ollama-net
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    volumes:
      - ${STACK_ROOT}/ollama/data/ollama:/root/.ollama:rw
      - ${STACK_ROOT}/ollama/scripts/entrypoint.sh:/entrypoint.sh:ro
    environment:
      # Use pure syntax for Dockhand parser compatibility
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # Explicitly mapped Tier Model variables for entrypoint.sh to read
      - OLLAMA_TIER1_MODELS=${OLLAMA_TIER1_MODELS}
      - OLLAMA_TIER2_MODELS=${OLLAMA_TIER2_MODELS}
      - OLLAMA_TIER3_MODELS=${OLLAMA_TIER3_MODELS}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE}
      - OLLAMA_FLASH_ATTENTION=1
    labels:
      - com.centurylinklabs.watchtower.enable=false
    healthcheck:
      test:
        - CMD
        - /usr/bin/ollama
        - list
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  open-webui:
    container_name: otsai-webui
    image: ghcr.io/open-webui/open-webui:v0.9.5
    mem_limit: 1g
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
    ports:
      - 10.0.1.15:8893:8080
    volumes:
      - ${STACK_ROOT}/ollama/data/open-webui:/app/backend/data:rw
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - OLLAMA_BASE_URL=http://otsai:11434
      - BRIDGE_SHARED_SECRET=${BRIDGE_SHARED_SECRET}
      - WEBUI_AUTH=1
      - WEBUI_NAME=OluTechSystems.AI
      - WEBUI_URL=${WEBUI_URL}
      - DEFAULT_MODELS=${DEFAULT_MODELS}
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fs http://localhost:8080/health >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - com.centurylinklabs.watchtower.enable=true
    extra_hosts:
      - otsorundscore.olutechsys.com:10.0.1.15
    networks:
      - ollama-net

networks:
  ollama-net:
    name: ollama-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.27.0.0/24
          gateway: 172.27.0.1