services:
  ollama:
    container_name: otsai
    # DS723+: AMD Ryzen R1600 (2 cores / 4 threads), 32 GB RAM, CPU-only.
    # PINNED: floating :latest is dangerous on a stateful model store. Refresh
    # this digest manually after testing on a non-prod host; this also gates
    # Watchtower from auto-pulling (mid-pull restart corrupts model blobs).
    # To refresh: docker pull ollama/ollama:0.24.0 ; docker inspect ...
    image: ollama/ollama:0.24.0
    # Host-profile fix (otsorundscore, 32 GB / 2c): lowered 14g -> 10g, reservation
    # 8g -> 6g. 7B-Q4 models RSS ~5-6 GB; 10g leaves 4 GB KV cache headroom and
    # recovers 4 GB for DSM + other stacks on this 2-core CPU-only host.
    mem_limit: 10g
    mem_reservation: 6g
    cpu_shares: 1024
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
    ports:
      - "10.0.1.15:11434:11434"
    networks:
      - ollama-net
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    volumes:
      - ${STACK_ROOT}/ollama/data/ollama:/root/.ollama:rw
      - ${STACK_ROOT}/ollama/scripts/entrypoint.sh:/entrypoint.sh:ro
    environment:
      # Restored pure variable syntax for Dockhand parser
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # Mapped for the entrypoint.sh auto-pull logic
      - MODELS=${OLLAMA_MODELS}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE}
      - OLLAMA_FLASH_ATTENTION=1
    labels:
      - com.centurylinklabs.watchtower.enable=false
      # Explicitly blocks Dockhand from auto-updating this stateful container
      - dockhand.update=false
    healthcheck:
      test:
        - CMD
        - /usr/bin/ollama
        - list
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  open-webui:
    container_name: otsai-webui
    image: ghcr.io/open-webui/open-webui:v0.9.5
    mem_limit: 1g
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
    ports:
      - "10.0.1.15:8893:8080"
    volumes:
      - ${STACK_ROOT}/ollama/data/open-webui:/app/backend/data:rw
    environment:
      # Restored pure variable syntax for Dockhand parser
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - OLLAMA_BASE_URL=http://otsai:11434
      - BRIDGE_SHARED_SECRET=${BRIDGE_SHARED_SECRET}
      - WEBUI_AUTH=1
      - WEBUI_NAME=OluTechSystems.AI
      - WEBUI_URL=${WEBUI_URL}
      - DEFAULT_MODELS=${DEFAULT_MODELS}
    depends_on:
      ollama:
        condition: service_healthy
      pipelines:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fs http://localhost:8080/health >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - com.centurylinklabs.watchtower.enable=true
      # Creates a clickable quick-launch link in the Dockhand dashboard
      - dockhand.url=${WEBUI_URL}
    extra_hosts:
      - otsorundscore.olutechsys.com:10.0.1.15
    networks:
      - ollama-net

  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    container_name: otsai-pipelines
    # DS723+: Pipelines is a lightweight FastAPI process; 512m is generous for
    # pipeline scripts. Raise if running heavy NLP pipelines locally.
    mem_limit: 512m
    cpu_shares: 512
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
    ports:
      - "${NAS_IP:-10.0.1.15}:9099:9099"
    volumes:
      - ${STACK_ROOT}/ollama/data/pipelines:/app/pipelines:rw
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # API key Open WebUI uses to authenticate to this pipelines instance.
      # Set PIPELINES_API_KEY in .env; add the same key in Open WebUI:
      #   Admin → Settings → Connections → add OpenAI-compatible URL:
      #   http://pipelines:9099  key: <PIPELINES_API_KEY>
      - PIPELINES_API_KEY=${PIPELINES_API_KEY}
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fs http://localhost:9099/ >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - ollama-net

networks:
  ollama-net:
    name: ollama-net
    driver: bridge
    ipam:
      config:
        # Synology DS723+ local LLM inference network.
        # Subnet 172.27.0.0/24 per host-profile (avoid collision with dozzle 172.31.0.0/24 and watchtower 172.31.1.0/24).
        - subnet: 172.27.0.0/24
          gateway: 172.27.0.1