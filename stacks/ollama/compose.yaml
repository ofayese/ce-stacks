services:
  ollama:
    container_name: otsai-server
    # DS723+: AMD Ryzen R1600 (2 cores / 4 threads), 32 GB RAM, CPU-only.
    # Check https://hub.docker.com/r/ollama/ollama/tags for latest stable.
    image: ollama/ollama@sha256:d00473cb58f0082c07cd6ed0d326a8a86f443ab69c51f8fc2b1a41687d45c661
    # GAP-05 fix: reduced from 16g → 14g. 14B Q4_K_M models need ~8.5 GB; 14g gives
    # 5.5 GB KV cache headroom while recovering 2 GB for DSM + other stacks.
    mem_limit: 14g
    mem_reservation: 8g
    cpu_shares: 1024
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
    # network_mode: host — shares host network stack so ollama can reach
    # registry.ollama.ai for model pulls. Synology Docker bridge DNS is broken:
    # 127.0.0.11 unreachable, and outbound UDP/53 is firewalled from container nets.
    # Port 11434 is exposed directly on the NAS host; no ports: mapping needed.
    network_mode: "host"
    # entrypoint.sh pattern from mariushosting.com: starts ollama serve then pulls
    # models in one container — no separate init container needed.
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    volumes:
      - ${STACK_ROOT}/ollama/data/ollama:/root/.ollama:rw
      - ${STACK_ROOT}/ollama/scripts/entrypoint.sh:/entrypoint.sh:ro
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      # Model list is hardcoded in scripts/entrypoint.sh.
      # Override here only if you need a non-default set:
      # - MODELS=phi4:mini,nomic-embed-text
      # CPU: keep at 1 — parallelism halves per-request throughput on R1600
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      # CPU: only one model in memory at a time
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
      # Keep model loaded 30 min after last request (CPU reload takes 15-60s)
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      # Flash attention reduces KV cache memory — always enable on CPU
      - OLLAMA_FLASH_ATTENTION=1
      - TZ=America/New_York
    labels:
      - com.centurylinklabs.watchtower.enable=true
    # Healthcheck: ollama binary self-probe via CMD (curl not in image).
    healthcheck:
      test:
        - CMD
        - /usr/bin/ollama
        - list
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  open-webui:
    container_name: otsai-webui
    image: ghcr.io/open-webui/open-webui:v0.9.2
    mem_limit: 2g
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
    ports:
      - 10.0.1.15:8893:8080
    volumes:
      - ${STACK_ROOT}/ollama/data/open-webui:/app/backend/data:rw
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      # otsai-server uses network_mode: host — reach via NAS LAN IP (not Docker DNS)
      - OLLAMA_BASE_URL=http://10.0.1.15:11434
      - BRIDGE_SHARED_SECRET=${BRIDGE_SHARED_SECRET}
      - WEBUI_AUTH=1
      - WEBUI_NAME=olutechsys AI
      - WEBUI_URL=${WEBUI_URL:-https://oai.otsorundscore.olutechsys.com}
      # Comma-separated model names shown in dropdown (does NOT auto-pull).
      # entrypoint.sh handles auto-pull when otsai-server starts.
      - DEFAULT_MODELS=${DEFAULT_MODELS:-phi4:mini,qwen2.5-coder:7b,nomic-embed-text}
      - TZ=America/New_York
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fs http://localhost:8080/health >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - com.centurylinklabs.watchtower.enable=true
    extra_hosts:
      - otsorundscore.olutechsys.com:10.0.1.15
    networks:
      - ollama-net

networks:
  ollama-net:
    # Used by open-webui only. otsai-server uses network_mode: host.
    name: ollama-net
    driver: bridge
    ipam:
      config:
        # Subnet registry: 172.27.0.0/24 allocated to ollama-net (see README.md)
        - subnet: 172.27.0.0/24
          gateway: 172.27.0.1
