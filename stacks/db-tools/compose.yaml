services:
  adminer:
    container_name: Adminer
    image: adminer:5.4.2-standalone
    mem_limit: 256m
    cpu_shares: 256
    # cpus: removed - Synology DS723+ kernel lacks CFS scheduler cgroup (NanoCPUs unsupported)
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
    ports:
      - "${NAS_IP:-10.0.1.15}:${ADMINER_PORT:-8895}:8080"
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      # Point at Synology native package databases (NAS LAN IP).
      # Adminer supports MariaDB, PostgreSQL, and SQLite in one tool -- no phpMyAdmin needed.
      - ADMINER_DEFAULT_SERVER=${ADMINER_DEFAULT_SERVER:-10.0.1.15}
      - ADMINER_DESIGN=hydra
      - TZ=${TZ:-America/New_York}
    healthcheck:
      test:
        - CMD
        - curl
        - -fs
        - http://localhost:8080/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - haproxy.enable=true
      - haproxy.host=adminer.olutechsys.com,adminer.olutech.systems,adminer.otsorundscore.olutechsys.com,adminer.otsorundscore.olutech.systems
      - haproxy.port=${ADMINER_PORT:-8895}
      - haproxy.backend=adminer-be
  # phpMyAdmin removed -- Adminer covers both MariaDB and PostgreSQL in one container.
  # CodeServerPMA (stacks/code-server, port 8379) handles the code-server MySQL sidecar.
