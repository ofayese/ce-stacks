services:
  dozzle:
    container_name: Dozzle
    image: amir20/dozzle:v10.5.1
    # Host-profile fix: 3g -> 256m. Dozzle is a log tailer -- 3g was a copy-paste
    # artifact. Measured RSS on a busy DS723+ stays under 80 MB.
    mem_limit: 256m
    cpu_shares: 768
    # cpus: removed - Synology DS723+ kernel lacks CFS scheduler cgroup (NanoCPUs unsupported)
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - "10.0.1.15:8892:8080"
    volumes:
      # /var/run socket context
      # docker.sock :ro -- Dozzle reads container metadata and logs only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${STACK_ROOT}/dozzle:/data:rw
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - DOZZLE_AUTH_PROVIDER=simple
      - TZ=America/New_York
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - haproxy.enable=true
      - haproxy.host=dozzle.olutechsys.com,dozzle.olutech.systems,dozzle.otsorundscore.olutechsys.com,dozzle.otsorundscore.olutech.systems
      - haproxy.port=8892
      - haproxy.backend=dozzle-be
    networks:
      - dozzle-net
    healthcheck:
      test:
        - CMD
        - /dozzle
        - healthcheck
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
networks:
  dozzle-net:
    name: dozzle-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
          gateway: 172.31.0.1
