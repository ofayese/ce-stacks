services:
  synology-api-bridge:
    build: .
    image: synology-api-bridge:local
    container_name: SynologyApiBridge
    # NOTE(DSM 7.3): build: . above. First deploy MUST come from SSH, not Container
    # Manager UI -- see docs/dsm-732-runtime-quirks.md S.1.
    #   cd /volume2/docker/ce-stacks/stacks/synology-api-bridge
    #   sudo /usr/local/bin/docker compose build && sudo /usr/local/bin/docker compose up -d
    restart: unless-stopped
    mem_limit: 256m
    cpu_shares: 256
    # cpus: removed - Synology DS723+ kernel lacks CFS scheduler cgroup (NanoCPUs unsupported)
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}  
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    volumes:
      - ${STACK_ROOT}/synology-api-bridge/data:/data:rw
    ports:
      - "${NAS_IP:-10.0.1.15}:8780:8000"
    labels:
      # Local build -- never auto-update via Watchtower.
      - com.centurylinklabs.watchtower.enable=false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - ce-internal

networks:
  ce-internal:
    # Cross-stack backbone: other containers call this bridge at
    # http://SynologyApiBridge:8000 without going through the host.
    external: true
