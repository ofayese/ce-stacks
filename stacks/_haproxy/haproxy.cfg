# HAProxy - Synology bare-metal package layout
# Configuration file (live): /var/packages/haproxy/var/haproxy.cfg
# Certificate directory (live): /var/packages/haproxy/var/crt/
# Map file (live): /volume2/docker/ce-stacks/stacks/_haproxy/maps/host.map
#
# !! DO NOT EDIT haproxy.cfg DIRECTLY !!
# This file (haproxy.cfg.head) is the static infrastructure template.
# Docker service backends are auto-generated from haproxy.* compose labels.
# Run: bash /volume2/docker/ce-stacks/scripts/generate-haproxy.sh
#
# Operator workflow:
#   1) Add haproxy.* labels to the service's compose.yaml
#   2) Run scripts/generate-haproxy.sh  (validates and writes haproxy.cfg + host.map)
#   3) DSM -> Package Center -> HAProxy -> Edit configuration -> Paste -> Validate -> Apply
#   4) Action -> Stop -> Start  (first run) or Action -> Restart  (subsequent)
#   5) For host.map-only changes (existing backends): scripts/haproxy-reload-map.sh (no restart)
#
# Port layout (IMPORTANT — SynoCommunity package hardcodes 8281 for its management UI):
#   8281  listen stats  — plain HTTP, SynoCommunity HAProxy management UI (Package Center "Open")
#   8280  frontend https-in — HTTPS ingress gateway for all public domains
#
# Static backends in this file (not auto-discovered — native Synology packages or bare-metal):
#   haproxyhttps-be    10.0.1.15:8281   HAProxy stats/mgmt UI (HTTP, proxied via 8280 HTTPS)
#   otsorundscore-be   10.0.1.15:5010   Synology DSM (HTTPS, default fallback)
#   saltgui-be         10.0.1.15:8282   SynoCommunity salt-master web UI
#   dockhand-be        10.0.1.15:3866   Dockhand (bare-metal RC script)
#   ntopng-be          10.0.1.15:3000   ntopng (native NAS package)
#   gotify-be          10.0.1.15:8035   Gotify push notification server (native)
#   uptime-kuma-be     10.0.1.15:3001   Uptime Kuma monitoring dashboard (native)
#   minio-console-be   10.0.1.15:9001   MinIO S3 console/web UI (native)
#   minio-api-be       10.0.1.15:9000   MinIO S3 API endpoint (native)
#   nodeexporter-be    10.0.1.15:9100   Prometheus node-exporter (INTERNAL ONLY)
#   otscal-be          10.0.1.15:20003  OTS Calendar   (native HTTPS)
#   otscnt-be          10.0.1.15:25556  OTS Contacts   (native HTTPS)
#   otsfst-be          10.0.1.15:7001   OTS File Store (native HTTPS)
#   otsnt-be           10.0.1.15:9351   OTS Net Tools  (native HTTPS)
#   sso-be             10.0.1.15:8843   Synology SSO   (native HTTPS)
#   otspht-be          10.0.1.15:5080   OTS Photos     (HTTP only)
#   otsvmm-be          10.0.1.15:14640  OTS VMM        (HTTP only)
#
# Validate before pasting into DSM "Edit configuration":
#   sudo /volume1/@appstore/haproxy/sbin/haproxy -c -f /var/packages/haproxy/var/haproxy.cfg

global
    user sc-haproxy
    daemon
    maxconn 400
    log ring@httplog local0 info
    spread-checks 10
    ssl-default-bind-options ssl-min-ver TLSv1.2
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    tune.ssl.default-dh-param 2048
    # Runtime API socket - required for haproxy-reload-map.sh live map reloads
    stats socket /var/packages/haproxy/var/haproxy-api.sock mode 660 level admin
    stats timeout 30s

# Ring buffer for HTTP access logging (written to file) - Synology package default paths
ring httplog
    description "HTTP access log buffer"
    format rfc3164
    maxlen 2048
    size 65535
    backing-file /var/packages/haproxy/var/http-access.log

defaults
    mode    http
    log     global
    option  httplog
    option  dontlognull
    option  forwardfor if-none
    option  http-server-close
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    timeout tunnel 1h

# ---------------------------------------------------------------------------
# HAProxy Statistics + Management UI
# Binds to 8281 (plain HTTP) — SynoCommunity package hardcodes this port.
# Package Center "Open" button and local access: http://10.0.1.15:8281/
# Remote access via HTTPS: https://haproxy.olutechsys.com (proxied through 8280 frontend)
# ---------------------------------------------------------------------------
listen stats
    bind 10.0.1.15:8281
    mode http
    stats enable
    stats uri /
    stats show-legends
    stats refresh 10s
    stats realm HAProxy\ Statistics
    acl is_local src 127.0.0.1 10.0.1.0/24
    stats admin if is_local
    # !! ACTION REQUIRED: change the password below before pasting into DSM !!
    # Format: stats auth USERNAME:PASSWORD
    stats auth sc-haproxy:BlueSky9922!

# ---------------------------------------------------------------------------
# Main HTTPS Ingress Proxy
# Binds to 8280 (HTTPS) — the public-facing edge gateway for all domains.
# TLS: combined fullchain+key PEM built from /volume2/certs/acme/otsorundscore/
# Routes unmatched hosts to otsorundscore-be (DSM dashboard).
# ---------------------------------------------------------------------------
frontend https-in
    bind 10.0.1.15:8280 ssl crt /volume2/certs/acme/otsorundscore/haproxy.pem alpn h2,http/1.1
    mode http
    http-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains"
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Real-IP %[src]
    http-request add-header X-Forwarded-For %[src]
    # CF Tunnel: when request arrives from Docker bridge (tunnel container), trust
    # the X-Forwarded-For it injected as the real client IP. Narrow this ACL to
    # the actual tunnel container subnet once Cloudflare Tunnel is deployed.
    acl is_cf_tunnel src 172.16.0.0/12
    http-request set-header X-Real-IP %[req.hdr(X-Forwarded-For),field(1)] if is_cf_tunnel
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }
    use_backend %[req.hdr(host),lower,map(/volume2/docker/ce-stacks/stacks/_haproxy/maps/host.map,otsorundscore-be)]

# ---------------------------------------------------------------------------
# Static backends — native Synology packages and bare-metal services
# These are NOT auto-generated. Edit here, then re-run generate-haproxy.sh.
# ---------------------------------------------------------------------------

backend otsorundscore-be
    # Synology DSM dashboard - default fallback for unmatched hostnames
    option httpchk GET /
    server otsorundscore 10.0.1.15:5010 ssl verify none check

backend haproxyhttps-be
    # HAProxy stats/mgmt UI — proxies HTTPS traffic from the 8280 frontend
    # to the plain-HTTP stats listener on 8281 (SynoCommunity package native port).
    # No SSL here: 8281 is plain HTTP; TLS is terminated at the 8280 frontend.
    option httpchk GET /
    server haproxyhttps 10.0.1.15:8281 check

backend saltgui-be
    # SaltGUI - SynoCommunity salt-master web UI (port 8282)
    # Binds to 0.0.0.0:8282 — reachable via loopback or LAN IP.
    option httpchk GET /
    server saltgui 127.0.0.1:8282 check

backend dockhand-be
    # Dockhand - stack manager (port 3866)
    # Bare-metal RC script or containerized (stacks/dockhand/compose.yaml) — both bind host:3866.
    option httpchk GET /
    server dockhand 10.0.1.15:3866 check

backend ntopng-be
    # ntopng - native NAS network analysis package
    # SynoCommunity packages often bind to 127.0.0.1; use loopback.
    option httpchk GET /
    server ntopng 127.0.0.1:3000 check

backend nodeexporter-be
    # Prometheus node-exporter - INTERNAL ONLY, no public Cloudflare CNAME
    # Prometheus scrapes this directly; it has no authentication by default.
    option httpchk GET /metrics
    server nodeexporter 10.0.1.15:9100 check

# ---------------------------------------------------------------------------
# OTS native Synology services (HTTPS ports)
# HAProxy terminates external TLS; backend uses native Synology self-signed cert.
# ---------------------------------------------------------------------------

backend otscal-be
    # OTS Calendar - HTTP port 20002, native HTTPS port 20003
    option httpchk GET /
    server otscal 10.0.1.15:20003 ssl verify none check

backend otscnt-be
    # OTS Contacts - HTTP port 25555, native HTTPS port 25556
    option httpchk GET /
    server otscnt 10.0.1.15:25556 ssl verify none check

backend otsfst-be
    # OTS File Storage - HTTP port 7000, native HTTPS port 7001
    option httpchk GET /
    server otsfst 10.0.1.15:7001 ssl verify none check

backend otsnt-be
    # OTS Network Tools - HTTP port 9350, native HTTPS port 9351
    option httpchk GET /
    server otsnt 10.0.1.15:9351 ssl verify none check

backend sso-be
    # Synology SSO - HTTP port 8800, native HTTPS port 8843
    # SSO redirect URIs must resolve via the public hostname (sso.olutechsys.com).
    option httpchk GET /
    server sso 10.0.1.15:8843 ssl verify none check

# ---------------------------------------------------------------------------
# OTS native Synology services (HTTP only — no native HTTPS available)
# ---------------------------------------------------------------------------

backend otspht-be
    # OTS Photos - HTTP port 5080 (native HTTPS: 5443)
    option httpchk GET /
    server otspht 10.0.1.15:5080 check

backend otsvmm-be
    # OTS Virtual Machine Manager - HTTP port 14640 (native HTTPS: 14641)
    option httpchk GET /
    server otsvmm 10.0.1.15:14640 check

# ---------------------------------------------------------------------------
# SynoCommunity native package backends
# ---------------------------------------------------------------------------

backend gotify-be
    # Gotify - push notification server (SynoCommunity native, port 8035)
    # Uses WebSocket for real-time delivery — timeout tunnel 1h covers this.
    option httpchk GET /health
    server gotify 10.0.1.15:8035 check

backend uptime-kuma-be
    # Uptime Kuma - uptime monitoring dashboard (SynoCommunity native, port 3001)
    option httpchk GET /
    server uptime-kuma 10.0.1.15:3001 check

backend minio-console-be
    # MinIO Console - web UI for S3 object storage (SynoCommunity native, port 9001)
    option httpchk GET /minio/health/live
    server minio-console 10.0.1.15:9001 check

backend minio-api-be
    # MinIO S3 API endpoint (SynoCommunity native, port 9000)
    # Used by S3-compatible clients; s3.olutechsys.com routes here.
    option httpchk GET /minio/health/live
    server minio-api 10.0.1.15:9000 check

