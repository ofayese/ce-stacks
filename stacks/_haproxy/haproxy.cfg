global
    user sc-haproxy
    daemon
    maxconn 400
    log ring@httplog local0 info
    spread-checks 10
    ssl-default-bind-options ssl-min-ver TLSv1.2
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    tune.ssl.default-dh-param 2048
    # Runtime API socket - required for haproxy-reload-map.sh live map reloads
    stats socket /var/packages/haproxy/var/haproxy-api.sock mode 660 level admin
    stats timeout 30s

ring httplog
    description "HTTP access log buffer"
    format rfc3164
    maxlen 2048
    size 65535
    backing-file /var/packages/haproxy/var/http-access.log

defaults
    mode    http
    log     global
    option  httplog
    option  dontlognull
    option  forwardfor if-none
    option  http-server-close
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    timeout tunnel 1h

### ### ---------------------------------------------------------------------------
### HAProxy Management UI (HTTPS Port 8281)
### ---------------------------------------------------------------------------
listen stats
    # Added SSL termination so https://otsorundscore.olutechsys.com:8281/ works natively
    bind 10.0.1.15:8281 ssl crt /volume2/certs/acme/otsorundscore/haproxy.pem alpn h2,http/1.1
    mode http
    stats enable
    stats uri /
    stats show-legends
    stats refresh 10s
    stats realm HAProxy\ Statistics
    # Turns the read-only stats report into an interactive Management UI
    stats admin if TRUE
    # !! TD-05 ACTION REQUIRED: change the password on the line below before clicking Apply !!
    # Format: stats auth USERNAME:PASSWORD
    stats auth sc-haproxy:BlueSky9922!

### ---------------------------------------------------------------------------
### Main HTTPS Ingress Proxy (Port 8280)
### ---------------------------------------------------------------------------
frontend https-in
    # TLS: combined fullchain+key PEM built from /volume2/certs/acme/otsorundscore/
    bind 10.0.1.15:8280 ssl crt /volume2/certs/acme/otsorundscore/haproxy.pem alpn h2,http/1.1
    mode http
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Real-IP %[src]
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }
    
    # Routes to otsorundscore-be by default if the requested domain doesn't match the map
    use_backend %[req.hdr(host),lower,map(/volume2/docker/ce-stacks/stacks/_haproxy/maps/host.map,otsorundscore-be)]

