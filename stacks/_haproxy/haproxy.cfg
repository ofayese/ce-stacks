# HAProxy - Synology bare-metal package layout
# Configuration file (live): /var/packages/haproxy/var/haproxy.cfg
# Certificate directory (live): /var/packages/haproxy/var/crt/
# Map file (live): /volume2/docker/ce-stacks/stacks/_haproxy/maps/host.map
#
# DSM Package Center (HAProxy 3.x): merged with Synology stock global/logging (user sc-haproxy,
# daemon, ring-backed access log). Validate before pasting into DSM "Edit configuration":
#   sudo /volume1/@appstore/haproxy/sbin/haproxy -c -f /var/packages/haproxy/var/haproxy.cfg
#
# Cert deployment: use stacks/acme-sh/scripts/deploy_certs.sh (default target: /var/packages/haproxy/var/crt/)
# then restart HAProxy: DSM -> Package Center -> HAProxy -> Action -> Restart
#
# Layout:
#   /var/packages/haproxy/var/crt/  PEM bundles (fullchain + key) deployed by deploy_certs.sh
#   /volume2/docker/ce-stacks/stacks/_haproxy/maps/host.map  Host -> backend (tab-separated)
#
# Operator:
#   1) Run stacks/acme-sh/scripts/deploy_certs.sh to build and deploy PEM bundles
#   2) haproxy -c -f /var/packages/haproxy/var/haproxy.cfg
#   3) Paste validated config via DSM -> Package Center -> HAProxy -> Edit configuration
#   4) Restart HAProxy: DSM -> Package Center -> HAProxy -> Action -> Restart
#
# -- Apply via GUI (REQUIRED - never sudo cp) -----------------------------------
#   DSM -> Package Center -> HAProxy -> Edit configuration
#   Paste the full contents of this file. Click Validate, then Apply.
#   See stacks/_haproxy/README.md -> "Applying Configuration Changes"
# ------------------------------------------------------------------------------
#
# Canonical HAProxy config for the NAS. Validated by scripts/validate-haproxy-proposal.sh.
#
# Backend registry (keep in sync with maps/host.map):
#   homepage-be        10.0.1.15:7575   homepage
#   dozzle-be          10.0.1.15:8892   dozzle
#   ittools-be         10.0.1.15:8894   it-tools
#   searxng-be         10.0.1.15:8888   searxng
#   openwebui-be       10.0.1.15:8893   ollama/open-webui
#   codexdocs-be       10.0.1.15:8896   codex-docs
#   adminer-be         10.0.1.15:8895   db-tools/adminer (MariaDB + PostgreSQL)
#   codeserver-be      10.0.1.15:8377   code-server
#   phpmyadmin-be      10.0.1.15:8379   code-server/CodeServerPMA (dev MySQL sidecar)
#   openresume-be      10.0.1.15:8889   openresume
#   grafana-be         10.0.1.15:3340   grafana-prom/grafana
#   zabbix-be          10.0.1.15:8532   zabbix/zabbix-web
#   psu-be             10.0.1.15:5570   otspsu (PSU NOC dashboard)
#   saltgui-be         10.0.1.15:3333   saltgui (SynoCommunity salt-master / salt-api)
#   dockhand-be        10.0.1.15:3866   dockhand
#   remotely-be        10.0.1.15:5371   remotely (remote support)
#   github-desktop-be  10.0.1.15:3405   github-desktop (KasmVNC)
#   ntopng-be          10.0.1.15:3000   ntopng (native NAS package)
#   nodeexporter-be    10.0.1.15:9100   prometheus node-exporter (INTERNAL ONLY)
#   otscal-be          10.0.1.15:20002  OTS Calendar
#   otscnt-be          10.0.1.15:25555  OTS Contacts
#   otsfst-be          10.0.1.15:7000   OTS File Storage
#   otsnt-be           10.0.1.15:9350   OTS Network Tools
#   sso-be             10.0.1.15:8800   SSO
#   otspht-be          10.0.1.15:5080   OTS Photos
#   otsvmm-be          10.0.1.15:14640  OTS VMM

global
    user sc-haproxy
    daemon
    maxconn 4096
    log ring@httplog local0 info
    spread-checks 10
    ssl-default-bind-options ssl-min-ver TLSv1.2
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    tune.ssl.default-dh-param 2048

# Ring buffer for HTTP access logging (written to file) - Synology package default paths
ring httplog
    description "HTTP access log buffer"
    format rfc3164
    maxlen 2048
    size 65535
    backing-file /var/packages/haproxy/var/http-access.log

defaults
    mode    http
    log     global
    option  httplog
    option  dontlognull
    option  forwardfor if-none
    option  http-server-close
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    timeout tunnel 1h

listen stats
    bind 10.0.1.15:8282
    stats enable
    stats uri /
    stats show-legends
    stats refresh 10s
    stats realm HAProxy\ Statistics
    # !! ACTION REQUIRED: change the password on the line below before clicking Apply !!
    # This line is NOT sourced from .env - it must be edited directly here in the DSM GUI
    # editor every time you paste this config. Pasting without changing it will reset your
    # stats page password to whatever is set here.
    # Format: stats auth USERNAME:PASSWORD
    stats auth otsadmin:Batman@5010

frontend http-redirect
    bind 10.0.1.15:8280
    mode http
    redirect scheme https code 301

frontend https-in
    # TLS: at least one readable *.pem under /var/packages/haproxy/var/crt/ (fullchain + key, deployed by deploy_certs.sh).
    bind 10.0.1.15:8281 ssl crt /var/packages/haproxy/var/crt/ alpn h2,http/1.1
    mode http
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Real-IP %[src]
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }
    use_backend %[req.hdr(host),lower,map(/volume2/docker/ce-stacks/stacks/_haproxy/maps/host.map,homepage-be)]

# ---------------------------------------------------------------------------
# Core stacks - dashboard, infra, dev tools
# ---------------------------------------------------------------------------

backend homepage-be
    option httpchk GET /
    server homepage 10.0.1.15:7575 check

backend dozzle-be
    option httpchk GET /
    server dozzle 10.0.1.15:8892 check

backend saltgui-be
    # SaltGUI - SaltStack web UI (SynoCommunity salt-master package, salt-api port 3333)
    option httpchk GET /
    server saltgui 10.0.1.15:3333 check

backend dockhand-be
    # Dockhand git-backed stack manager - port 3866
    option httpchk GET /
    server dockhand 10.0.1.15:3866 check

backend ittools-be
    option httpchk GET /
    server ittools 10.0.1.15:8894 check

backend openresume-be
    option httpchk GET /
    server openresume 10.0.1.15:8889 check

backend remotely-be
    # remotely - remote support, screen share and scripting - port 5371
    option httpchk GET /
    server remotely 10.0.1.15:5371 check

backend github-desktop-be
    # github-desktop - KasmVNC browser GUI - port 3405
    option httpchk GET /
    server github-desktop 10.0.1.15:3405 check

# ---------------------------------------------------------------------------
# Development tools
# ---------------------------------------------------------------------------

backend codeserver-be
    option httpchk GET /
    server codeserver 10.0.1.15:8377 check

backend adminer-be
    # db-tools/Adminer - covers native Synology MariaDB (3306) and PostgreSQL (5432)
    option httpchk GET /
    server adminer 10.0.1.15:8895 check

backend phpmyadmin-be
    # code-server/CodeServerPMA - targets code-server MySQL sidecar (internal port 3307)
    # NOTE: port 8379, NOT 8378. db-tools removed PhpMyAdmin; Adminer covers native DBs.
    option httpchk GET /
    server phpmyadmin 10.0.1.15:8379 check

# ---------------------------------------------------------------------------
# AI / Search
# ---------------------------------------------------------------------------

backend openwebui-be
    option httpchk GET /
    server openwebui 10.0.1.15:8893 check

backend searxng-be
    option httpchk GET /
    server searxng 10.0.1.15:8888 check

# ---------------------------------------------------------------------------
# Monitoring & observability
# ---------------------------------------------------------------------------

backend grafana-be
    # grafana-prom/Grafana - metrics dashboards (Prometheus, SNMP, cAdvisor, InfluxDB)
    option httpchk GET /api/health
    server grafana 10.0.1.15:3340 check

backend zabbix-be
    # zabbix/Zabbix-Web - infrastructure monitoring UI
    option httpchk GET /ping
    server zabbix 10.0.1.15:8532 check

# node exporter: INTERNAL ONLY - do not create a public Cloudflare DNS record.
# Prometheus scrapes this directly; it has no authentication by default.
backend nodeexporter-be
    option httpchk GET /metrics
    server nodeexporter 10.0.1.15:9100 check

backend ntopng-be
    # ntopng network traffic analysis UI (native NAS package) - port 3000
    option httpchk GET /
    server ntopng 10.0.1.15:3000 check

# ---------------------------------------------------------------------------
# Automation & NOC
# ---------------------------------------------------------------------------

backend psu-be
    # otspsu (PowerShell Universal) - NAS NOC dashboard and automation
    option httpchk GET /
    server psu 10.0.1.15:5570 check

backend codexdocs-be
    option httpchk GET /
    server codexdocs 10.0.1.15:8896 check

# ---------------------------------------------------------------------------
# OTS native Synology services
# Dual-port services: HAProxy terminates external TLS and proxies to the HTTP
# port; the upper port (native HTTPS/secondary) is documented in comments only.
# ---------------------------------------------------------------------------

backend otscal-be
    # OTS Calendar service - HTTP port 20002 (native HTTPS: 20003)
    option httpchk GET /
    server otscal 10.0.1.15:20002 check

backend otscnt-be
    # OTS Contacts service - HTTP port 25555 (native HTTPS: 25556)
    option httpchk GET /
    server otscnt 10.0.1.15:25555 check

backend otsfst-be
    # OTS File/Fast Storage - HTTP port 7000 (native HTTPS: 7001)
    option httpchk GET /
    server otsfst 10.0.1.15:7000 check

backend otsnt-be
    # OTS Network Tools - HTTP port 9350 (native HTTPS: 9351)
    option httpchk GET /
    server otsnt 10.0.1.15:9350 check

backend sso-be
    # Single Sign-On - HTTP port 8800 (native HTTPS: 8843)
    # SSO redirect URIs must resolve via the public hostname (sso.olutechsys.com).
    # Ensure HTTPS redirect URIs are configured in the SSO provider, not HTTP.
    option httpchk GET /
    server sso 10.0.1.15:8800 check

backend otspht-be
    # OTS Photos - HTTP port 5080 (native HTTPS: 5443)
    option httpchk GET /
    server otspht 10.0.1.15:5080 check

backend otsvmm-be
    # OTS Virtual Machine Manager - HTTP port 14640 (native HTTPS: 14641)
    option httpchk GET /
    server otsvmm 10.0.1.15:14640 check

# eof - HAProxy 3.x requires LF after the last byte; DSM paste often drops it - see README.txt
