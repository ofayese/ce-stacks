# HAProxy - Synology bare-metal package layout
# Configuration file (live): /var/packages/haproxy/var/haproxy.cfg
# Certificate directory (live): /var/packages/haproxy/var/crt/
# Map file (live): /volume2/docker/ce-stacks/stacks/_haproxy/maps/host.map
#
# DSM Package Center (HAProxy 3.x): merged with Synology stock global/logging (user sc-haproxy,
# daemon, ring-backed access log). Validate before pasting into DSM "Edit configuration":
#   sudo /volume1/@appstore/haproxy/sbin/haproxy -c -f /var/packages/haproxy/var/haproxy.cfg
#
# Cert deployment: use stacks/acme-sh/scripts/deploy_certs.sh (default target: /var/packages/haproxy/var/crt/)
# then restart HAProxy: DSM → Package Center → HAProxy → Action → Restart
#
# Layout:
#   /var/packages/haproxy/var/crt/  PEM bundles (fullchain + key) deployed by deploy_certs.sh
#   /volume2/docker/ce-stacks/stacks/_haproxy/maps/host.map  Host → backend (tab-separated)
#
# Operator:
#   1) Run stacks/acme-sh/scripts/deploy_certs.sh to build and deploy PEM bundles
#   2) haproxy -c -f /var/packages/haproxy/var/haproxy.cfg
#   3) Restart HAProxy: DSM → Package Center → HAProxy → Action → Restart
#
# Canonical HAProxy config for the NAS. Validated by scripts/validate-haproxy-proposal.sh.

global
    user sc-haproxy
    daemon
    maxconn 4096
    log ring@httplog local0 info
    spread-checks 10
    ssl-default-bind-options ssl-min-ver TLSv1.2
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    tune.ssl.default-dh-param 2048

# Ring buffer for HTTP access logging (written to file) - Synology package default paths
ring httplog
    description "HTTP access log buffer"
    format rfc3164
    maxlen 2048
    size 65535
    backing-file /var/packages/haproxy/var/http-access.log

defaults
    mode    http
    log     global
    option  httplog
    option  dontlognull
    option  forwardfor if-none
    option  http-server-close
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    timeout tunnel 1h

listen stats
    bind 10.0.1.15:8282
    stats enable
    stats uri /
    stats show-legends
    stats refresh 10s
    stats realm HAProxy\ Statistics
    # Stats UI credentials: set on the NAS only. DSM stock example often uses otsadmin:<password>.
    stats auth admin:admin

frontend http-redirect
    bind 10.0.1.15:8280
    mode http
    redirect scheme https code 301

frontend https-in
    # TLS: at least one readable *.pem under /var/packages/haproxy/var/crt/ (fullchain + key, deployed by deploy_certs.sh).
    bind 10.0.1.15:8281 ssl crt /var/packages/haproxy/var/crt/ alpn h2,http/1.1
    mode http
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Real-IP %[src]
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }
    use_backend %[req.hdr(host),lower,map(/volume2/docker/ce-stacks/stacks/_haproxy/maps/host.map,homepage-be)]

backend homepage-be
    option httpchk GET /
    server homepage 10.0.1.15:7575 check

backend portainer-be
    option httpchk GET /
    server portainer 10.0.1.15:9000 check

backend dozzle-be
    option httpchk GET /
    server dozzle 10.0.1.15:8892 check

backend ittools-be
    option httpchk GET /
    server ittools 10.0.1.15:8894 check

backend searxng-be
    option httpchk GET /
    server searxng 10.0.1.15:8888 check

backend openwebui-be
    option httpchk GET /
    server openwebui 10.0.1.15:8893 check

backend codexdocs-be
    option httpchk GET /
    server codexdocs 10.0.1.15:8896 check

backend adminer-be
    option httpchk GET /
    server adminer 10.0.1.15:8895 check

backend codeserver-be
    option httpchk GET /
    server codeserver 10.0.1.15:8377 check

backend phpmyadmin-be
    option httpchk GET /
    server phpmyadmin 10.0.1.15:8378 check

backend openresume-be
    option httpchk GET /
    server openresume 10.0.1.15:8889 check

backend hcld-be
    option httpchk GET /
    server hcld 10.0.1.15:3059 check

backend dockge-be
    option httpchk GET /
    server dockge 10.0.1.15:5571 check

# ---------------------------------------------------------------------------
# HTTP backends — web services (routed via https-in → host.map)
# Dual-port services: HAProxy terminates external TLS and proxies to the HTTP
# port; the upper port (native HTTPS/secondary) is documented in comments only.
# ---------------------------------------------------------------------------

backend ntopng-be
    # ntopng network traffic analysis UI — port 3000 (HTTP)
    option httpchk GET /
    server ntopng 10.0.1.15:3000 check

backend dockhand-be
    # Dockhand container management — port 3866 (HTTP)
    option httpchk GET /
    server dockhand 10.0.1.15:3866 check

# node exporter: INTERNAL ONLY — do not create a public Cloudflare DNS record.
# Prometheus scrapes this; it has no authentication by default.
backend nodeexporter-be
    # Prometheus node exporter — port 9100 (HTTP metrics)
    option httpchk GET /metrics
    server nodeexporter 10.0.1.15:9100 check

backend otscal-be
    # OTS Calendar service — HTTP port 20002 (native HTTPS: 20003)
    option httpchk GET /
    server otscal 10.0.1.15:20002 check

backend otscnt-be
    # OTS Contacts service — HTTP port 25555 (native HTTPS: 25556)
    option httpchk GET /
    server otscnt 10.0.1.15:25555 check

backend otsfst-be
    # OTS File/Fast Storage — HTTP port 7000 (native HTTPS: 7001)
    option httpchk GET /
    server otsfst 10.0.1.15:7000 check

backend otsnt-be
    # OTS Network Tools — HTTP port 9350 (native HTTPS: 9351)
    option httpchk GET /
    server otsnt 10.0.1.15:9350 check

backend sso-be
    # Single Sign-On — HTTP port 8800 (native HTTPS: 8843)
    # SSO redirect URIs must resolve via the public hostname (sso.olutechsys.com).
    # Ensure HTTPS redirect URIs are configured in the SSO provider, not HTTP.
    option httpchk GET /
    server sso 10.0.1.15:8800 check

backend otspht-be
    # OTS Photos — HTTP port 5080 (native HTTPS: 5443)
    option httpchk GET /
    server otspht 10.0.1.15:5080 check

backend otsvmm-be
    # OTS Virtual Machine Manager — HTTP port 14640 (native HTTPS: 14641)
    option httpchk GET /
    server otsvmm 10.0.1.15:14640 check

# ---------------------------------------------------------------------------
# TCP frontends + backends — non-HTTP binary protocols (LAN-only)
# SECURITY: Do NOT add these hostnames to Cloudflare Tunnel DNS.
# ASSUMPTION: each daemon is bound to 127.0.0.1 (localhost); HAProxy exposes
# it on 10.0.1.15 for LAN access with health checking and connection limits.
# If the daemon already binds to 10.0.1.15 directly, remove the HAProxy
# frontend for that service and access it by IP:port directly.
# ---------------------------------------------------------------------------

frontend memcached-tcp
    # Memcached — no auth by default; LAN access only.
    bind 10.0.1.15:11211
    mode tcp
    default_backend memcached-be

frontend postgres-alt-tcp
    # PostgreSQL alternate instance — port 5433.
    bind 10.0.1.15:5433
    mode tcp
    default_backend postgres-alt-be

frontend redis-tcp
    # Redis/Valkey — LAN access only; ensure requirepass is set on the daemon.
    bind 10.0.1.15:6379
    mode tcp
    default_backend redis-be

frontend zabbix-agent-tcp
    # Zabbix passive agent — Zabbix server connects here to poll metrics.
    bind 10.0.1.15:10050
    mode tcp
    default_backend zabbix-agent-be

backend memcached-be
    mode tcp
    option tcp-check
    server memcached 127.0.0.1:11211 check

backend postgres-alt-be
    mode tcp
    option tcp-check
    server postgres-alt 127.0.0.1:5433 check

backend redis-be
    mode tcp
    option tcp-check
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    server redis 127.0.0.1:6379 check

backend zabbix-agent-be
    mode tcp
    option tcp-check
    server zabbix-agent 127.0.0.1:10050 check

frontend port5005-tcp
    # Unidentified persistent service — confirm what is running on 5005 before exposing.
    bind 10.0.1.15:5005
    mode tcp
    default_backend port5005-be

frontend port5006-tcp
    bind 10.0.1.15:5006
    mode tcp
    default_backend port5006-be

frontend port5009-tcp
    # Unidentified persistent service — confirm what is running on 5009 before exposing.
    bind 10.0.1.15:5009
    mode tcp
    default_backend port5009-be

frontend port5010-tcp
    bind 10.0.1.15:5010
    mode tcp
    default_backend port5010-be

frontend plex-tcp
    # Plex Media Server — direct TCP passthrough on port 32400.
    # PREREQUISITE: Plex must bind to 127.0.0.1:32400, not 0.0.0.0:32400.
    # If Plex binds to 0.0.0.0, it already owns 10.0.1.15:32400 and this
    # frontend will fail to start (bind conflict). In that case, comment out
    # this frontend and access Plex directly via 10.0.1.15:32400.
    # UPnP context: router forwards external ports 25857 and 24550 → :32400.
    bind 10.0.1.15:32400
    mode tcp
    default_backend plex-be

backend port5005-be
    mode tcp
    option tcp-check
    server port5005 127.0.0.1:5005 check

backend port5006-be
    mode tcp
    option tcp-check
    server port5006 127.0.0.1:5006 check

backend port5009-be
    mode tcp
    option tcp-check
    server port5009 127.0.0.1:5009 check

backend port5010-be
    mode tcp
    option tcp-check
    server port5010 127.0.0.1:5010 check

backend plex-be
    mode tcp
    option tcp-check
    server plex 127.0.0.1:32400 check

# eof - HAProxy 3.x requires LF after the last byte; DSM paste often drops it - see README.txt

