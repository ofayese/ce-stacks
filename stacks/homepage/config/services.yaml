        server: my-docker
        container: Dockhand
        siteMonitor: http://10.0.1.15:3866/

    - Watchtower:
        # Container name from: watchtower/compose.yaml (service: watchtower)
        icon: watchtower.png
        description: Automatic container updates (daily 4 AM EST)
        server: my-docker
        container: Watchtower

    - GitHub Desktop:
        # Container name from: github-desktop/compose.yaml (service: github-desktop)
        icon: github.png
        href: http://10.0.1.15:3405/
        description: GitHub Desktop GUI via KasmVNC browser session
        server: my-docker
