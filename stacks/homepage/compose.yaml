services:
  homepage:
    container_name: Homepage
    image: ghcr.io/gethomepage/homepage:v1.13.1
    mem_limit: 512m
    cpu_shares: 512
    # cpus: removed - Synology DS723+ kernel lacks CFS scheduler cgroup (NanoCPUs unsupported)
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
    ports:
      - "${NAS_IP:-10.0.1.15}:${HOMEPAGE_PORT:-7575}:3000"
    volumes:
      - ${STACK_ROOT}/homepage/config:/app/config:rw
      - ${STACK_ROOT}/homepage/data:/app/public/icons:rw

      # /var/run socket context
      # docker.sock :ro - Homepage reads container metadata only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - TZ=${TIMEZONE:-America/New_York}
      # Allow access from the Synology LAN IP and your domain.
      # Set HOMEPAGE_ALLOWED_HOSTS in .env; include every hostname/IP used to access the UI.
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS:-10.0.1.15:7575}
      # Widget credentials: homepage substitutes ${VAR} in config/services.yaml using
      # container environment. These must be passed here; set values in .env.
      - GRAFANA_USERNAME=${GRAFANA_USERNAME:-}
      - GRAFANA_PASSWORD=${GRAFANA_PASSWORD:-}
      - WATCHTOWER_BEARER_TOKEN=${WATCHTOWER_BEARER_TOKEN:-}
      - ZABBIX_USERNAME=${ZABBIX_USERNAME:-}
      - ZABBIX_PASSWORD=${ZABBIX_PASSWORD:-}
    # Healthcheck type B: own binary probe (image ships CLI tool for this)
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:3000/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - com.centurylinklabs.watchtower.enable=false
    networks:
      - homepage-net
    extra_hosts:
      - otsorundscore.olutechsys.com:10.0.1.15
networks:
  homepage-net:
    name: homepage-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.9.0/24
          gateway: 172.31.9.1