services:
  homepage:
    container_name: Homepage
    # TD-06: Pinned image to stable v1.13.1 for stateful UI stability
    image: ghcr.io/gethomepage/homepage:v1.13.1
    networks:
      - homepage-net
    ports:
      - "10.0.1.15:${HOMEPAGE_PORT}:3000"
    environment:
      # Stripped bash fallbacks for pure Dockhand compatibility
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      # Required so services.yaml can interpolate credentials for widgets
      - WATCHTOWER_BEARER_TOKEN=${WATCHTOWER_BEARER_TOKEN}
      - GRAFANA_USERNAME=${GRAFANA_USERNAME}
      - GRAFANA_PASSWORD=${GRAFANA_PASSWORD}
      - ZABBIX_USERNAME=${ZABBIX_USERNAME}
      - ZABBIX_PASSWORD=${ZABBIX_PASSWORD}
    volumes:
      - ${STACK_ROOT}/homepage/config:/app/config:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
    labels:
      # Protects stateful UI from auto-updates
      - com.centurylinklabs.watchtower.enable=false
      - dockhand.update=false
      - dockhand.url=http://10.0.1.15:${HOMEPAGE_PORT}

networks:
  homepage-net:
    name: homepage-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.5.0/24
          gateway: 172.30.5.1