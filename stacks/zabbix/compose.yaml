services:
  postgres:
    container_name: Zabbix-Postgres
    image: postgres:15-alpine
    mem_limit: 768m
    cpu_shares: 1024
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - zabbix-net
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - TZ=${TZ:-America/New_York}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${STACK_ROOT}/zabbix/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "zabbix", "-d", "zabbix"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=false

  zabbix-server:
    container_name: Zabbix-Server
    image: zabbix/zabbix-server-pgsql:alpine-7.4.10
    mem_limit: 768m
    cpu_shares: 1024
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - zabbix-net
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "10.0.1.15:${ZABBIX_SERVER_PORT:-10051}:10051"
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - TZ=${TZ:-America/New_York}
      - DB_SERVER_HOST=postgres
      - DB_SERVER_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${STACK_ROOT}/zabbix/data:/var/lib/zabbix
    healthcheck:
      test: ["CMD", "zabbix_server", "-R", "diaginfo"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=false

  zabbix-web:
    container_name: Zabbix-Web
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4.10
    mem_limit: 512m
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - zabbix-net
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_healthy
    ports:
      - "10.0.1.15:${ZABBIX_WEB_PORT}:8080"
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - TZ=${TZ:-America/New_York}
      - DB_SERVER_HOST=postgres
      - DB_SERVER_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=10051
      - PHP_TZ=${TZ:-America/New_York}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=false

  zabbix-agent:
    container_name: Zabbix-Agent
    image: zabbix/zabbix-agent2:alpine-7.4.10
    # Bridge networking via zabbix-net. The agent collects host metrics through
    # bind-mounted /proc, /sys, /var/run -- network_mode:host is not required for data
    # collection. Active checks connect to zabbix-server by Docker DNS (same network).
    # network_mode:host is avoided because Synology DS723+ has AppArmor stubs in the
    # kernel that make runc attempt a profile write to /proc/self/attr/exec (read-only)
    # at container init -- this breaks ALL host-network containers regardless of
    # security_opt settings.
    networks:
      - zabbix-net
    mem_limit: 128m
    cpu_shares: 256
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      zabbix-server:
        condition: service_healthy
    environment:
      - PUID=${PUID:-0}
      - PGID=${PGID:-0}
      - TZ=${TZ:-America/New_York}
      # NOTE: zabbix-agent2 image uses ZBX_HOSTNAME -- not ZBX_AGENT_HOSTNAME.
      # Set ZBX_HOSTNAME in .env (e.g. ZBX_HOSTNAME=Synology-DS723).
      - ZBX_HOSTNAME=${ZBX_HOSTNAME:-Synology-DS723}
      # Use Docker DNS -- agent and server share zabbix-net.
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=${ZABBIX_SERVER_PORT:-10051}
      - ZBX_ACTIVE_ALLOW=true
      - ZBX_PASSIVE_ALLOW=true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /proc:/proc:ro
    healthcheck:
      test: ["CMD", "zabbix_agent2", "-t", "agent.ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=false

networks:
  zabbix-net:
    name: zabbix-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1