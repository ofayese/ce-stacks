services:
  postgres:
    container_name: Zabbix-Postgres
    image: postgres:15-alpine
    mem_limit: 768m
    cpu_shares: 1024
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - zabbix-net
    environment:
      # Stripped bash fallbacks for full Dockhand .env parser compatibility
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${STACK_ROOT}/zabbix/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "zabbix", "-d", "zabbix"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=false

  zabbix-server:
    container_name: Zabbix-Server
    image: zabbix/zabbix-server-pgsql:alpine-7.4.10
    mem_limit: 768m
    cpu_shares: 1024
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - zabbix-net
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "10.0.1.15:${ZABBIX_SERVER_PORT}:10051"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DB_SERVER_HOST=postgres
      - DB_SERVER_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ${STACK_ROOT}/zabbix/data:/var/lib/zabbix
    healthcheck:
      test: ["CMD", "zabbix_server", "-R", "diaginfo"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=false

  zabbix-web:
    container_name: Zabbix-Web
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4.10
    mem_limit: 512m
    cpu_shares: 768
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - zabbix-net
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_healthy
    ports:
      - "10.0.1.15:${ZABBIX_WEB_PORT}:8080"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DB_SERVER_HOST=postgres
      - DB_SERVER_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=10051
      - PHP_TZ=${TZ}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=false

  zabbix-agent:
    container_name: Zabbix-Agent
    image: zabbix/zabbix-agent2:alpine-7.4.10
    networks:
      - zabbix-net
    mem_limit: 128m
    cpu_shares: 256
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      zabbix-server:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - ZBX_HOSTNAME=${ZBX_HOSTNAME}
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=${ZABBIX_SERVER_PORT}
      - ZBX_ACTIVE_ALLOW=true
      - ZBX_PASSIVE_ALLOW=true
      - ZBX_DONTCREATEPIDFILE=1
    volumes:
      - /var/run:/var/run:ro
      - ${STACK_ROOT}/zabbix/config:/etc/zabbix:rw
      # The entrypoint (uid 1997 / zabbix) auto-generates plugin configs in plugins.d at startup.
      # Bind-mounting the full /etc/zabbix from the host means plugins.d inherits host ownership
      # (root:root / 755), which blocks uid 1997 writes → crash-loop "Permission denied".
      # Fix: shadow plugins.d with a Docker-managed named volume. Docker initialises the volume
      # from the image's own /etc/zabbix/zabbix_agent2.d/plugins.d with correct uid 1997
      # ownership, bypassing the host-filesystem restriction. The rest of /etc/zabbix
      # stays bind-mounted for persistence.
      - zabbix-plugins-d:/etc/zabbix/zabbix_agent2.d/plugins.d
    healthcheck:
      test: ["CMD", "zabbix_agent2", "-t", "agent.ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=false

volumes:
  # Writable Docker-managed volume shadowing zabbix_agent2.d/plugins.d.
  # Prevents "Permission denied" when the zabbix entrypoint (uid 1997) writes
  # auto-generated plugin configs into the bind-mounted /etc/zabbix host directory.
  zabbix-plugins-d:

networks:
  zabbix-net:
    name: zabbix-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
